name: Booking 4 growth mount
on:
  push:
    branches: [feature/booking-4-growth]
    paths: [.github/workflows/booking-v4-growth-mount.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-growth
      - name: Mount growth routers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts');s=p.read_text()
          if 'bookingV4GrowthPublicRouter' not in s:
            anchor='import bookingV4AdminRouter from"./routes/bookingV4Admin";'
            rep=anchor+'import{bookingV4GrowthPublicRouter,bookingV4GrowthAdminRouter}from"./routes/bookingV4Growth";'
            if anchor not in s: raise SystemExit('import anchor missing')
            s=s.replace(anchor,rep,1)
          if 'bookingV4GrowthPublicRouter);' not in s:
            anchor='app.use("/api/public/booking",bookingV4Router);'
            rep=anchor+'app.use("/api/public/booking",bookingV4GrowthPublicRouter);'
            if anchor not in s: raise SystemExit('public mount anchor missing')
            s=s.replace(anchor,rep,1)
          if 'bookingV4GrowthAdminRouter);' not in s:
            anchor='app.use("/api/admin/booking-v4",requireManagement,bookingV4AdminRouter);'
            rep=anchor+'app.use("/api/admin/booking-v4",requireManagement,bookingV4GrowthAdminRouter);'
            if anchor not in s: raise SystemExit('admin mount anchor missing')
            s=s.replace(anchor,rep,1)
          p.write_text(s)
          PY
      - run: grep -q bookingV4GrowthPublicRouter src/server.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/server.ts
          git diff --cached --quiet || (git commit -m "feat(booking-v4): mount growth analytics API" && git push origin HEAD:feature/booking-4-growth)
# trigger
