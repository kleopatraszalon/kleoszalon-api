name: Fix employee location SQL placeholder

on:
  push:
    branches:
      - agent/fix-dashboard-runtime-500s
    paths:
      - scripts/fix-employee-location-placeholder.mjs
      - .github/workflows/fix-employee-location-placeholder.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-runtime-500s
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply SQL placeholder repair
        run: node scripts/fix-employee-location-placeholder.mjs
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run dashboard runtime regression
        run: node --test tests/dashboard-runtime-compatibility.contract.test.js tests/first-request-workorder-readiness.contract.test.js
      - name: Run full regression suite
        run: npm test
      - name: TypeScript backend build
        run: |
          npm run clean
          npx tsc -p tsconfig.server.json
      - name: Commit validated source and remove one-shot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/employees.ts
          git rm scripts/fix-employee-location-placeholder.mjs
          git rm .github/workflows/fix-employee-location-placeholder.yml
          git diff --cached --check
          git commit -m "fix: restore employee location SQL placeholder"
          git push origin HEAD:agent/fix-dashboard-runtime-500s
