name: CRM pagination performance migration
on:
  push:
    branches:
      - agent/security-regression-hardening-20260814
    paths:
      - .github/workflows/performance-pagination-migration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-regression-hardening-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add bounded CRM pagination
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/clientsCore.ts')
          s=p.read_text(encoding='utf-8')
          anchor='''    const tagId = String(req.query.tag_id || "").trim() || null;'''
          insert='''    const tagId = String(req.query.tag_id || "").trim() || null;\n    const limit = Math.min(500, Math.max(1, Number(req.query.limit || 100) || 100));\n    const offset = Math.max(0, Number(req.query.offset || 0) || 0);'''
          if anchor not in s: raise SystemExit('tagId anchor not found')
          s=s.replace(anchor,insert,1)
          old='''      LIMIT 20000`, [locationId, q, status, tagId]);'''
          new='''      LIMIT $5::integer OFFSET $6::integer`, [locationId, q, status, tagId, limit, offset]);'''
          if old not in s: raise SystemExit('legacy LIMIT 20000 anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Clean install
        run: npm ci --no-fund --no-audit
      - name: Regression gate
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/regression.log
          tests=$(grep -E '^# tests [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          passed=$(grep -E '^# pass [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          failed=$(grep -E '^# fail [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          test "$tests" = "320" && test "$passed" = "320" && test "${failed:-1}" = "0"
      - name: TypeScript production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified pagination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/clientsCore.ts
          git diff --cached --quiet && exit 0
          git commit -m "perf: paginate CRM client list queries"
          git push origin HEAD:agent/security-regression-hardening-20260814
