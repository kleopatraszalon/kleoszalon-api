name: Finance v5 sync main
on:
  push:
    branches: [feature/finance-v5-altegio-20260813]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-v5-altegio-20260813
          fetch-depth: 0
      - name: Merge current main with explicit finance route resolution
        run: |
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            echo "main merged cleanly"
          else
            conflicted="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicted" != "src/routes/transactions.ts" ]; then
              echo "Unexpected merge conflicts: $conflicted"
              exit 1
            fi
            git checkout --theirs src/routes/transactions.ts
            python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/transactions.ts')
          s=p.read_text()
          imp='import financeAltegioV5Router from "./financeAltegioV5";\n'
          if imp not in s:
              anchor='import financeAltegioRouter from "./financeAltegio";\n'
              if anchor not in s:
                  anchor='import financeOperationsRouter from "./financeOperations";\n'
              if anchor not in s: raise SystemExit('finance import anchor missing')
              s=s.replace(anchor,anchor+imp,1)
          mount='router.use("/finance-v5",ensureFinanceReady,requireFeature("finance"),financeAltegioV5Router);\n'
          if mount not in s:
              anchor='router.use("/finance-operations",ensureFinanceReady,requireFeature("finance"),requireMenuPermissionByMethod("finance"),financeOperationsRouter);\n'
              if anchor not in s: raise SystemExit('finance mount anchor missing')
              s=s.replace(anchor,anchor+mount,1)
          p.write_text(s)
          PY
            git add src/routes/transactions.ts
            git commit --no-edit
          fi
          git push origin HEAD:feature/finance-v5-altegio-20260813
