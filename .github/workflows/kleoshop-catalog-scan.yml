name: Kleoshop catalog scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scrape-kleoshop-catalog.mjs'
      - '.github/workflows/kleoshop-catalog-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl complete Kleoshop catalog
        env:
          KLEOSHOP_MAX_PAGES: '3500'
          KLEOSHOP_CONCURRENCY: '10'
          KLEOSHOP_TIMEOUT_MS: '18000'
        run: node scripts/scrape-kleoshop-catalog.mjs

      - name: Show catalog summary
        if: always()
        run: cat artifacts/kleoshop-catalog-summary.md || true

      - name: Upload complete catalog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kleoshop-catalog
          path: |
            artifacts/kleoshop-catalog.json
            artifacts/kleoshop-catalog-summary.md
          if-no-files-found: error
          retention-days: 7
