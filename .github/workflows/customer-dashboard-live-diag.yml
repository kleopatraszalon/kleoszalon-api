name: Customer dashboard live diagnostic
on:
  push:
    branches: [diag/customer-dashboard-live-20260814]
    paths:
      - tests/customer_dashboard_live_diag.mjs
      - .github/workflows/customer-dashboard-live-diag.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/customer_dashboard_live_diag.mjs
