name: NAV real TEST UAT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/routes/auth.ts'
      - 'src/routes/navTestUat.ts'
      - 'src/routes/navOnlineInvoice.ts'
      - 'src/routes/navOnlineInvoiceStatus.ts'
      - 'src/nav/**'
      - '.github/workflows/nav-real-test-uat.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  nav-real-test-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Acquire short-lived NAV TEST UAT session
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 60); do
            oidc_response="$(curl -fsS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-nav-test-uat")"
            oidc_token="$(OIDC="$oidc_response" node -e "const x=JSON.parse(process.env.OIDC||'{}');process.stdout.write(String(x.value||''))")"
            if [ -z "$oidc_token" ]; then echo "GitHub OIDC token missing"; exit 1; fi
            code="$(curl -sS --max-time 30 -o /tmp/nav-auth.json -w '%{http_code}' -X POST -H "Authorization: Bearer $oidc_token" "$API_BASE_URL/api/uat/nav-test-token" || true)"
            if [ "$code" = "200" ]; then success=1; break; fi
            echo "Waiting for deployed NAV TEST UAT bootstrap ($attempt/60), HTTP=$code"
            sleep 10
          done
          if [ "$success" -ne 1 ]; then cat /tmp/nav-auth.json || true; exit 1; fi
          vir_token="$(node -e "const x=require('/tmp/nav-auth.json');if(!x.success||!x.token||x.uat_scope!=='nav_test')process.exit(1);process.stdout.write(String(x.token))")"
          echo "::add-mask::$vir_token"
          echo "VIR_TOKEN=$vir_token" >> "$GITHUB_ENV"
          echo "NAV TEST UAT authentication PASS"

      - name: Safely activate an existing TEST configuration if needed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/nav-config.json -w '%{http_code}' -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-test-uat/configuration")"
          if [ "$code" != "200" ]; then echo "NAV configuration read HTTP=$code"; cat /tmp/nav-config.json; exit 1; fi
          configured="$(node -e "const x=require('/tmp/nav-config.json');process.stdout.write(x.configured?'1':'0')")"
          if [ "$configured" != "1" ]; then
            oidc_response="$(curl -fsS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-nav-test-uat")"
            oidc_token="$(OIDC="$oidc_response" node -e "const x=JSON.parse(process.env.OIDC||'{}');process.stdout.write(String(x.value||''))")"
            echo "::add-mask::$oidc_token"
            ready_code="$(curl -sS --max-time 30 -o /tmp/nav-readiness.json -w '%{http_code}' -X POST -H "Authorization: Bearer $oidc_token" "$API_BASE_URL/api/uat/nav-test-readiness" || true)"
            if [ "$ready_code" != "200" ]; then echo "NAV credential readiness HTTP=$ready_code"; cat /tmp/nav-readiness.json || true; exit 1; fi
            node - <<'NODE'
          const x=require('/tmp/nav-readiness.json');
          const c=x.credentials||{};
          console.log('NAV TEST Render credential readiness:', JSON.stringify(c));
          const missing=Object.entries(c).filter(([,v])=>!v).map(([k])=>k);
          if(!x.all_configured){
            console.error('NAV_TEST_CREDENTIALS_MISSING: '+missing.join(', '));
            process.exit(2);
          }
          console.log('NAV TEST technical credentials are present in Render; stored supplier/company metadata is missing.');
          NODE
            rc=$?
            if [ "$rc" -eq 2 ]; then exit 1; fi
            echo "NAV_TEST_COMPANY_METADATA_MISSING: technical credentials exist, but no TEST configuration row exists. Supplier legal name, 11-digit tax number, postal code, city and address are required; no NAV network submission was attempted."
            exit 1
          fi
          environment="$(node -e "const x=require('/tmp/nav-config.json');process.stdout.write(String(x.config?.environment||''))")"
          if [ "$environment" != "test" ]; then
            echo "NAV_TEST_CONFIGURATION_BLOCKED: stored configuration is not TEST; automation will not modify it."
            cat /tmp/nav-config.json
            exit 1
          fi
          active="$(node -e "const x=require('/tmp/nav-config.json');process.stdout.write(x.active?'1':'0')")"
          if [ "$active" = "0" ]; then
            node - <<'NODE' > /tmp/nav-activate.json
          const x=require('/tmp/nav-config.json').config||{};
          const payload={environment:'test',location_id:x.location_id||null,supplier_name:x.supplier_name||'',supplier_tax_number:x.supplier_tax_number||'',supplier_postal_code:x.supplier_postal_code||'',supplier_city:x.supplier_city||'',supplier_address:x.supplier_address||'',invoice_prefix:x.invoice_prefix||'KLEO'};
          process.stdout.write(JSON.stringify(payload));
          NODE
            code="$(curl -sS --max-time 30 -o /tmp/nav-activate-response.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $VIR_TOKEN" -H 'Content-Type: application/json' --data @/tmp/nav-activate.json "$API_BASE_URL/api/transactions/nav-test-uat/configuration")"
            if [ "$code" != "200" ]; then echo "NAV TEST activation HTTP=$code"; cat /tmp/nav-activate-response.json; exit 1; fi
            echo "Existing NAV TEST configuration activated without changing stored secrets."
          else
            echo "NAV TEST configuration already active."
          fi

      - name: Prove TEST environment and configured credentials
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/nav-env.json -w '%{http_code}' -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-test-uat/environment")"
          if [ "$code" != "200" ]; then cat /tmp/nav-env.json; exit 1; fi
          node - <<'NODE'
          const x=require('/tmp/nav-env.json');
          if(x.ok!==true||x.environment!=='test'||x.test_ready!==true)process.exit(1);
          const c=x.credentials_configured||{};
          if(!c.technical_login||!c.technical_password||!c.signing_key||!c.exchange_key)process.exit(1);
          if(x.live_submission_blocked!==true)process.exit(1);
          console.log('NAV environment PASS: TEST only, credentials complete, live blocked');
          NODE

      - name: Real NAV TEST tokenExchange
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 40 -o /tmp/nav-connection.json -w '%{http_code}' -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-online-invoice/connection-test")"
          if [ "$code" != "200" ]; then echo "NAV tokenExchange HTTP=$code"; cat /tmp/nav-connection.json; exit 1; fi
          node -e "const x=require('/tmp/nav-connection.json');if(x.ok!==true||x.environment!=='test')process.exit(1);console.log('Real NAV TEST tokenExchange PASS, request_id='+String(x.request_id||''))"

      - name: Verify local official XSD validator
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/xsd.json -w '%{http_code}' -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-online-invoice/xsd-status")"
          if [ "$code" != "200" ]; then cat /tmp/xsd.json; exit 1; fi
          node -e "const x=require('/tmp/xsd.json');if(x.ok!==true||x.ready!==true||x.fail_closed!==true)process.exit(1);console.log('NAV XSD runtime PASS')"

      - name: Create isolated NAV UAT fixture
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/fixture.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIR_TOKEN" -H 'Content-Type: application/json' --data '{}' "$API_BASE_URL/api/transactions/nav-test-uat/fixture")"
          if [ "$code" != "201" ]; then echo "Fixture HTTP=$code"; cat /tmp/fixture.json; exit 1; fi
          invoice_id="$(node -e "const x=require('/tmp/fixture.json');if(!x.ok||x.environment!=='test'||x.live_submission_blocked!==true||!x.invoice?.id)process.exit(1);process.stdout.write(String(x.invoice.id))")"
          echo "INVOICE_ID=$invoice_id" >> "$GITHUB_ENV"
          echo "NAV TEST fixture PASS"

      - name: XSD-validate fixture
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/xsd-validate.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-online-invoice/invoices/$INVOICE_ID/xsd-validate")"
          if [ "$code" != "200" ]; then echo "XSD validation HTTP=$code"; cat /tmp/xsd-validate.json; exit 1; fi
          node -e "const x=require('/tmp/xsd-validate.json');if(x.ok!==true||x.operation!=='CREATE'||x.xsd?.valid!==true)process.exit(1);console.log('Fixture XSD validation PASS')"

      - name: Prepare NAV submission
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -o /tmp/prepare.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-online-invoice/invoices/$INVOICE_ID/prepare")"
          if [ "$code" != "201" ]; then echo "Prepare HTTP=$code"; cat /tmp/prepare.json; exit 1; fi
          submission_id="$(node -e "const x=require('/tmp/prepare.json');if(!x.submission?.id||x.submission?.environment!=='test'||x.operation!=='CREATE'||x.xsd_validation?.status!=='passed')process.exit(1);process.stdout.write(String(x.submission.id))")"
          echo "SUBMISSION_ID=$submission_id" >> "$GITHUB_ENV"
          echo "NAV TEST prepare PASS"

      - name: Submit to real NAV TEST manageInvoice
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 70 -o /tmp/submit.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIR_TOKEN" -H 'Content-Type: application/json' --data '{"uat_test_only":true}' "$API_BASE_URL/api/transactions/nav-online-invoice/submissions/$SUBMISSION_ID/submit")"
          if [ "$code" != "200" ]; then echo "NAV TEST manageInvoice HTTP=$code"; cat /tmp/submit.json; exit 1; fi
          node - <<'NODE'
          const x=require('/tmp/submit.json');
          if(x.ok!==true||x.environment!=='test'||!x.transaction_id||x.operation!=='CREATE')process.exit(1);
          console.log('Real NAV TEST manageInvoice PASS; transactionId received');
          NODE

      - name: Poll real NAV TEST transaction status
        shell: bash
        run: |
          set -euo pipefail
          terminal=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 40 -o /tmp/refresh.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-online-invoice/submissions/$SUBMISSION_ID/refresh")"
            if [ "$code" = "200" ]; then
              status="$(node -e "const x=require('/tmp/refresh.json');process.stdout.write(String(x.status||''))")"
              echo "NAV TEST status attempt $attempt: $status"
              if [ "$status" = "done" ] || [ "$status" = "warning" ]; then terminal=1; break; fi
              if [ "$status" = "error" ] || [ "$status" = "aborted" ]; then cat /tmp/refresh.json; exit 1; fi
            else
              echo "Status refresh HTTP=$code"
              cat /tmp/refresh.json || true
            fi
            sleep 10
          done
          if [ "$terminal" -ne 1 ]; then echo 'NAV TEST transaction did not reach an accepted terminal state'; cat /tmp/refresh.json || true; exit 1; fi
          node -e "const x=require('/tmp/refresh.json');if(x.environment!=='test'||Number(x.error_count||0)!==0)process.exit(1);console.log('Real NAV TEST queryTransactionStatus PASS; terminal='+x.status+', warnings='+Number(x.warning_count||0))"

      - name: Verify idempotency and audit chain
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/resubmit.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIR_TOKEN" -H 'Content-Type: application/json' --data '{"uat_test_only":true}' "$API_BASE_URL/api/transactions/nav-online-invoice/submissions/$SUBMISSION_ID/submit")"
          if [ "$code" != "200" ]; then cat /tmp/resubmit.json; exit 1; fi
          node -e "const x=require('/tmp/resubmit.json');if(x.ok!==true||x.idempotent!==true||x.environment!=='test'||!x.transaction_id)process.exit(1);console.log('NAV submit idempotency PASS')"
          code="$(curl -sS --max-time 30 -o /tmp/chain.json -w '%{http_code}' -H "Authorization: Bearer $VIR_TOKEN" "$API_BASE_URL/api/transactions/nav-test-uat/chain/$INVOICE_ID")"
          if [ "$code" != "200" ]; then cat /tmp/chain.json; exit 1; fi
          node -e "const x=require('/tmp/chain.json');if(x.ok!==true||!Array.isArray(x.submissions)||!x.submissions.some(s=>s.id===process.env.SUBMISSION_ID&&s.environment==='test'&&s.transaction_id))process.exit(1);console.log('NAV TEST audit chain PASS')"

      - name: Record NAV TEST evidence and close P0
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const issue_number=212;
            const issue=await github.rest.issues.get({owner,repo,issue_number});
            const body=[
              'P0 NAV TEST closure evidence recorded.',
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Head SHA: ${context.sha}`,
              '',
              '- TEST-only environment: PASS',
              '- NAV TEST technical credential readiness: PASS',
              '- tokenExchange: PASS',
              '- official XSD runtime and fixture validation: PASS',
              '- isolated UAT fixture: PASS',
              '- TEST manageInvoice submission: PASS',
              '- queryTransactionStatus terminal state: PASS',
              '- submit idempotency: PASS',
              '- audit chain: PASS',
              '',
              'No secret values are stored in this evidence.'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number,body});
            if(issue.data.state!=='closed'){
              await github.rest.issues.update({owner,repo,issue_number,state:'closed',state_reason:'completed'});
            }
