name: Agent dashboard runtime v2 repair

on:
  push:
    branches:
      - agent/fix-dashboard-runtime-500s-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-runtime-500s-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply production runtime patch
        run: python3 scripts/agent_dashboard_runtime_v2.py
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Full regression suite
        run: npm test
      - name: TypeScript build
        run: npx tsc -p tsconfig.server.json
      - name: Commit repaired runtime paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/virCustomizer.ts src/saas/ensureSaasCore.ts src/saas/ensureTenantIsolation.ts src/saas/tenantAccess.ts tests/startup-resilience.contract.test.js tests/vir-spec-parity.contract.test.js tests/dashboard-runtime-v2.contract.test.js
          git commit -m "Fix production dashboard tenant runtime 500s"
          git push origin HEAD:agent/fix-dashboard-runtime-500s-v2
