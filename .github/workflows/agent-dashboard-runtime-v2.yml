name: Agent dashboard runtime v2 repair

on:
  push:
    branches:
      - agent/fix-dashboard-runtime-500s-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-runtime-500s-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply production runtime patch
        run: python3 scripts/agent_dashboard_runtime_v2.py
      - name: Align tenant compatibility contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/saas-tenant-isolation.contract.test.js')
          s=p.read_text()
          old=r'assert.match(source, /e\.tenant_id=\$2::bigint OR l\.tenant_id=\$2::bigint/);'
          new=r'assert.match(source, /e\.tenant_id::text=\$2::text OR l\.tenant_id::text=\$2::text/);'
          if old not in s:
              raise SystemExit('tenant isolation contract pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Full regression suite
        run: npm test
      - name: TypeScript build
        run: npx tsc -p tsconfig.server.json
      - name: Commit repaired runtime paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/virCustomizer.ts src/saas/ensureSaasCore.ts src/saas/ensureTenantIsolation.ts src/saas/tenantAccess.ts tests/startup-resilience.contract.test.js tests/vir-spec-parity.contract.test.js tests/saas-tenant-isolation.contract.test.js tests/dashboard-runtime-v2.contract.test.js
          git commit -m "Fix production dashboard tenant runtime 500s"
          git push origin HEAD:agent/fix-dashboard-runtime-500s-v2
