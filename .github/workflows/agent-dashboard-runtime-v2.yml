name: Agent dashboard runtime v2 repair

on:
  push:
    branches:
      - agent/fix-dashboard-runtime-500s-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-runtime-500s-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch runtime compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) VIR customizer: node-postgres cannot execute a parameterized multi-command statement.
          p = Path('src/routes/virCustomizer.ts')
          s = p.read_text()
          start = s.index("let ready:Promise<void>|null=null;async function ensure(){")
          end = s.index("\nfunction merge", start)
          new = """let ready:Promise<void>|null=null;
          async function ensure(){
            if(!ready){
              ready=(async()=>{
                await db.query(`CREATE TABLE IF NOT EXISTS vir_customization(id int PRIMARY KEY DEFAULT 1 CHECK(id=1),config jsonb NOT NULL DEFAULT '{}'::jsonb,updated_by text,updated_at timestamptz NOT NULL DEFAULT now())`);
                await db.query(`INSERT INTO vir_customization(id,config) VALUES(1,$1::jsonb) ON CONFLICT(id) DO NOTHING`,[JSON.stringify(DEFAULTS)]);
                await db.query(`CREATE TABLE IF NOT EXISTS vir_customization_audit(id bigserial PRIMARY KEY,changed_at timestamptz NOT NULL DEFAULT now(),changed_by text,before_config jsonb,after_config jsonb)`);
              })().catch(err=>{ready=null;throw err});
            }
            return ready;
          }
          """.strip()
          p.write_text(s[:start] + new + s[end:])

          # 2) Employees dashboard fast path: read legacy schemas via row JSON instead of direct optional columns.
          p = Path('src/routes/employees.ts')
          s = p.read_text()
          start = s.index('async function listEmployeesLegacyScoped')
          end = s.index('function employeeFilterPlan', start)
          new = r'''async function listEmployeesLegacyScoped(includeInactive:boolean,locationId:string|null){
            const relationState=await pool.query(`SELECT to_regclass('public.locations') IS NOT NULL has_locations,to_regclass('public.hr_positions') IS NOT NULL has_positions`);
            const hasLocations=Boolean(relationState.rows[0]?.has_locations),hasPositions=Boolean(relationState.rows[0]?.has_positions);
            const activeExpr=`COALESCE(NULLIF(to_jsonb(e)->>'active','')::boolean,true)`;
            const locationExpr=`NULLIF(to_jsonb(e)->>'location_id','')`;
            const positionExpr=`NULLIF(to_jsonb(e)->>'position_id','')`;
            const fullNameExpr=`COALESCE(NULLIF(to_jsonb(e)->>'full_name',''),NULLIF(trim(concat_ws(' ',to_jsonb(e)->>'last_name',to_jsonb(e)->>'first_name')),''),'Munkatárs')`;
            const joins=[hasLocations?`LEFT JOIN locations l ON l.id::text=${locationExpr}`:'',hasPositions?`LEFT JOIN hr_positions p ON p.id::text=${positionExpr}`:''].filter(Boolean).join(' ');
            const locationName=hasLocations?`l.name`:`NULL::text`;
            const positionName=hasPositions?`COALESCE(NULLIF(p.name,''),NULLIF(to_jsonb(e)->>'position_name',''),NULLIF(to_jsonb(e)->>'position',''),NULLIF(to_jsonb(e)->>'role',''))`:`COALESCE(NULLIF(to_jsonb(e)->>'position_name',''),NULLIF(to_jsonb(e)->>'position',''),NULLIF(to_jsonb(e)->>'role',''))`;
            const values:any[]=[];const filters:string[]=[];
            if(!includeInactive)filters.push(`${activeExpr}=true`);
            if(locationId){values.push(locationId);filters.push(`${locationExpr}=$${values.length}::text`)}
            const where=filters.length?`WHERE ${filters.join(' AND ')}`:'';
            return pool.query(`SELECT
              NULLIF(to_jsonb(e)->>'id','') AS id,
              ${locationExpr} AS location_id,
              ${locationName} AS location_name,
              ${fullNameExpr} AS full_name,
              NULLIF(to_jsonb(e)->>'first_name','') AS first_name,
              NULLIF(to_jsonb(e)->>'last_name','') AS last_name,
              NULLIF(to_jsonb(e)->>'email','') AS email,
              NULLIF(to_jsonb(e)->>'phone','') AS phone,
              NULLIF(to_jsonb(e)->>'birth_date','') AS birth_date,
              NULLIF(to_jsonb(e)->>'qualification','') AS qualification,
              NULLIF(to_jsonb(e)->>'employment_type','') AS employment_type,
              ${positionExpr} AS position_id,
              ${positionName} AS position_name,
              NULLIF(to_jsonb(e)->>'monthly_wage','') AS monthly_wage,
              NULLIF(to_jsonb(e)->>'hourly_wage','') AS hourly_wage,
              NULLIF(to_jsonb(e)->>'commission_percent','') AS commission_percent,
              NULLIF(to_jsonb(e)->>'photo_url','') AS photo_url,
              ${activeExpr} AS active,
              NULLIF(to_jsonb(e)->>'login_name','') AS login_name,
              to_jsonb(e)->'role' AS role,
              NULLIF(to_jsonb(e)->>'created_at','') AS created_at,
              NULLIF(to_jsonb(e)->>'updated_at','') AS updated_at
              FROM employees e ${joins} ${where}
              ORDER BY ${activeExpr} DESC,${fullNameExpr}`,values)
          }
          async function listEmployeesLegacy(includeInactive:boolean){return listEmployeesLegacyScoped(includeInactive,null)}
          '''
          p.write_text(s[:start] + new + s[end:])

          # 3) Timetable: optional booking tables/columns are schema-version tolerant.
          p = Path('src/routes/timetable.ts')
          s = p.read_text()
          start = s.index('    const relationState=await pool.query', s.index('router.get("/"'))
          end = s.index('\n    const apRes = await pool.query', start)
          new = r'''    const relationState=await pool.query(`SELECT
              to_regclass('public.appointment_services') IS NOT NULL has_services,
              to_regclass('public.appointment_products') IS NOT NULL has_products,
              to_regclass('public.services') IS NOT NULL has_service_catalog,
              to_regclass('public.clients') IS NOT NULL has_clients,
              to_regclass('public.work_orders') IS NOT NULL has_work_orders`);
            const state=relationState.rows[0]||{};
            const hasServices=Boolean(state.has_services),hasProducts=Boolean(state.has_products),hasServiceCatalog=Boolean(state.has_service_catalog),hasClients=Boolean(state.has_clients),hasWorkOrders=Boolean(state.has_work_orders);
            const serviceLabelSql=hasServiceCatalog
              ? `COALESCE(NULLIF(to_jsonb(s)->>'name',''),NULLIF(to_jsonb(aps)->>'service_name',''),NULLIF(to_jsonb(aps)->>'service_id',''),'')`
              : `COALESCE(NULLIF(to_jsonb(aps)->>'service_name',''),NULLIF(to_jsonb(aps)->>'service_id',''),'')`;
            const serviceJoinSql=hasServiceCatalog?`LEFT JOIN services s ON s.id::text=NULLIF(to_jsonb(aps)->>'service_id','')`:``;
            const serviceNamesSql=hasServices
              ? `COALESCE((SELECT array_agg(${serviceLabelSql}) FROM appointment_services aps ${serviceJoinSql} WHERE NULLIF(to_jsonb(aps)->>'appointment_id','')=a.id::text),ARRAY[]::text[])`
              : `ARRAY[]::text[]`;
            const serviceTotalSql=hasServices
              ? `COALESCE((SELECT SUM(CASE WHEN COALESCE(NULLIF(to_jsonb(aps)->>'price',''),NULLIF(to_jsonb(aps)->>'unit_price',''),'') ~ '^-?[0-9]+([.][0-9]+)?$' THEN COALESCE(NULLIF(to_jsonb(aps)->>'price',''),NULLIF(to_jsonb(aps)->>'unit_price',''))::numeric ELSE 0 END) FROM appointment_services aps WHERE NULLIF(to_jsonb(aps)->>'appointment_id','')=a.id::text),0)`
              : `0`;
            const productTotalSql=hasProducts
              ? `COALESCE((SELECT SUM((CASE WHEN COALESCE(NULLIF(to_jsonb(ap)->>'qty',''),NULLIF(to_jsonb(ap)->>'quantity',''),'') ~ '^-?[0-9]+([.][0-9]+)?$' THEN COALESCE(NULLIF(to_jsonb(ap)->>'qty',''),NULLIF(to_jsonb(ap)->>'quantity',''))::numeric ELSE 1 END)*(CASE WHEN COALESCE(NULLIF(to_jsonb(ap)->>'price',''),NULLIF(to_jsonb(ap)->>'unit_price',''),'') ~ '^-?[0-9]+([.][0-9]+)?$' THEN COALESCE(NULLIF(to_jsonb(ap)->>'price',''),NULLIF(to_jsonb(ap)->>'unit_price',''))::numeric ELSE 0 END)) FROM appointment_products ap WHERE NULLIF(to_jsonb(ap)->>'appointment_id','')=a.id::text),0)`
              : `0`;
            const clientJoinSql=hasClients?`LEFT JOIN clients c ON c.id::text=a.client_id::text`:``;
            const clientNameSql=hasClients?`COALESCE(NULLIF(to_jsonb(c)->>'full_name',''),NULLIF(to_jsonb(c)->>'name',''),'')`:`''::text`;
            const workOrderClosedSql=hasWorkOrders?`OR EXISTS(SELECT 1 FROM work_orders w WHERE w.id::text=NULLIF(to_jsonb(a)->>'work_order_id','') AND (lower(COALESCE(to_jsonb(w)->>'status',''))='completed' OR NULLIF(to_jsonb(w)->>'locked_at','') IS NOT NULL OR NULLIF(to_jsonb(w)->>'archived_at','') IS NOT NULL))`:``;
            const workOrderProgressSql=hasWorkOrders?`OR EXISTS(SELECT 1 FROM work_orders w WHERE w.id::text=NULLIF(to_jsonb(a)->>'work_order_id','') AND lower(COALESCE(to_jsonb(w)->>'status',''))='in_progress')`:``;
            const workOrderArrivedSql=hasWorkOrders?`OR EXISTS(SELECT 1 FROM work_orders w WHERE w.id::text=NULLIF(to_jsonb(a)->>'work_order_id','') AND lower(COALESCE(to_jsonb(w)->>'status',''))='arrived')`:``;
          '''
          s = s[:start] + new + s[end:]

          # Replace only the appointment query block so optional clients/workorders are dynamic too.
          start = s.index('    const apRes = await pool.query', s.index('router.get("/"'))
          end = s.index('\n\n    return res.json', start)
          new = r'''    const apRes = await pool.query(
              `
              SELECT
                a.id::text,
                a.employee_id::text,
                a.client_id::text AS client_id,
                ${clientNameSql} AS client_name,
                a.location_id::text,
                NULL::text AS location_name,
                a.title,
                a.start_time,
                a.end_time,
                a.status,
                CASE
                  WHEN lower(COALESCE(a.status,'')) IN ('completed','paid') ${workOrderClosedSql} THEN 'work_order_closed'
                  WHEN lower(COALESCE(a.status,''))='in_progress' ${workOrderProgressSql} THEN 'in_progress'
                  WHEN lower(COALESCE(a.status,''))='arrived' ${workOrderArrivedSql} THEN 'arrived'
                  ELSE COALESCE(NULLIF(lower(a.status),''),'waiting')
                END AS operational_status,
                a.notes,
                ${serviceNamesSql} AS service_names,
                (${serviceTotalSql}+${productTotalSql})::numeric AS total
              FROM appointments a
              ${clientJoinSql}
              WHERE a.start_time >= ($1::date)::timestamp
                AND a.start_time < (($2::date + INTERVAL '1 day')::timestamp)
                AND ($3::text IS NULL OR a.location_id::text=$3::text)
              ORDER BY a.start_time ASC
              `,
              [from,to,locationId]
            );'''
          p.write_text(s[:start] + new + s[end:])

          # Permanent regression guard for the runtime failure modes seen in production.
          Path('tests/dashboard-runtime-v2.contract.test.js').write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          test('VIR customizer bootstrap does not parameterize multiple SQL commands',()=>{
            const s=fs.readFileSync('src/routes/virCustomizer.ts','utf8');
            assert.doesNotMatch(s,/CREATE TABLE IF NOT EXISTS vir_customization[\s\S]*INSERT INTO vir_customization[\s\S]*\`,\[JSON\.stringify\(DEFAULTS\)\]/);
            assert.match(s,/await db\.query\(`INSERT INTO vir_customization/);
          });
          test('employee dashboard fast path tolerates legacy optional columns',()=>{
            const s=fs.readFileSync('src/routes/employees.ts','utf8');
            assert.match(s,/to_jsonb\(e\)->>'location_id'/);
            assert.match(s,/async function listEmployeesLegacy\(includeInactive:boolean\)/);
          });
          test('timetable optional booking details do not directly reference versioned columns',()=>{
            const s=fs.readFileSync('src/routes/timetable.ts','utf8');
            assert.doesNotMatch(s,/aps\.sort_order|aps\.created_at|COALESCE\(aps\.price|COALESCE\(ap\.qty|COALESCE\(ap\.price/);
            assert.match(s,/to_jsonb\(aps\)->>'unit_price'/);
            assert.match(s,/to_jsonb\(ap\)->>'quantity'/);
          });
          ''')
          PY
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Regression tests
        run: npm test
      - name: TypeScript build
        run: npx tsc -p tsconfig.server.json
      - name: Commit repaired runtime paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/virCustomizer.ts src/routes/employees.ts src/routes/timetable.ts tests/dashboard-runtime-v2.contract.test.js
          git commit -m "Fix production dashboard schema compatibility v2"
          git push origin HEAD:agent/fix-dashboard-runtime-500s-v2
