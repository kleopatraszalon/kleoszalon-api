name: Apply dashboard runtime 500 fix

on:
  push:
    branches:
      - agent/fix-dashboard-runtime-500s
    paths:
      - scripts/apply-dashboard-runtime-500-fix.mjs
      - .github/workflows/apply-dashboard-runtime-500-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-runtime-500s
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic source patch
        run: |
          sed -i '/const first=source.indexOf(before),second=source.indexOf(before,first+before.length);/d; /if(second!==-1)throw new Error/d' scripts/apply-dashboard-runtime-500-fix.mjs
          node scripts/apply-dashboard-runtime-500-fix.mjs
      - name: Remove one-shot patch assets and commit source fixes
        run: |
          rm scripts/apply-dashboard-runtime-500-fix.mjs
          rm .github/workflows/apply-dashboard-runtime-500-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden dashboard employee and timetable runtime"
          git push origin HEAD:agent/fix-dashboard-runtime-500s
