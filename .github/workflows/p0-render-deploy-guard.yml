name: P0 Render deploy guard

on:
  workflow_run:
    workflows: ["Render deploy"]
    types: [requested, in_progress]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  guard-production-deploy:
    name: Block Render deploy while P0 is open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify P0 state and cancel unsafe production deploy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const governanceFailures = [];
            const p0Failures = [];
            const canonicalRequiredChecks = [
              'build',
              'regression-build-rbac-security',
              'production-baseline-smoke'
            ];
            const remediationAllowlist = new Set([
              '.github/workflows/p0-render-deploy-guard.yml',
              '.github/workflows/vir-release-candidate.yml',
              'src/routes/onlineBooking.ts',
              'src/routes/onlineBookingHealth.ts',
              'tests/live-runtime-hotfix.contract.test.js'
            ]);

            if (!run || run.name !== 'Render deploy') {
              core.notice('Not a Render deploy workflow_run event.');
              return;
            }

            try {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (!branch.data.protected) {
                governanceFailures.push('P0/4 main branch protected=false');
              }
              const contexts = branch.data.protection?.required_status_checks?.contexts || [];
              for (const required of canonicalRequiredChecks) {
                if (!contexts.includes(required)) {
                  governanceFailures.push(`P0/4 required status check ${required} is missing`);
                }
              }
            } catch (error) {
              governanceFailures.push(`P0/4 readable branch protection metadata cannot be proven (${error.status || error.message})`);
            }

            try {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: 320 });
              if (issue.data.state !== 'closed') {
                governanceFailures.push('P0/4 branch governance evidence issue #320 is open');
              }
            } catch (error) {
              governanceFailures.push('P0/4 branch governance evidence issue #320 cannot be verified');
            }

            // Operator decision 2026-08-19: P0/2 credential rotation is an explicit
            // risk acceptance under restricted single-operator access. Rotation is
            // deferred; this does not claim provider-side rotation evidence.
            core.notice('P0/2 credential rotation risk acceptance recorded; deploy guard does not block on issue #62.');

            // Operator decision 2026-08-19: P0/3 NAV TEST UAT is explicitly deferred.
            // The issue remains open and visible, but it is not a production deploy
            // blocker until the NAV integration is brought into the release scope.
            core.notice('P0/3 NAV TEST UAT is explicitly deferred; deploy guard does not block on issue #212.');

            for (const item of [
              { number: 270, label: 'P0/1 backup/restore' },
            ]) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: item.number });
                if (issue.data.state !== 'closed') {
                  p0Failures.push(`${item.label} issue #${item.number} is still open`);
                }
              } catch (error) {
                p0Failures.push(`${item.label} issue #${item.number} cannot be verified`);
              }
            }

            let remediation = false;
            let remediationFiles = [];
            try {
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: run.head_sha });
              const message = String(commit.data.commit?.message || '');
              remediationFiles = (commit.data.files || []).map(file => file.filename);
              remediation =
                message.startsWith('[p0-remediation]') &&
                remediationFiles.length > 0 &&
                remediationFiles.every(file => remediationAllowlist.has(file));
            } catch (error) {
              core.warning(`Unable to classify remediation commit: ${error.status || error.message}`);
            }

            core.summary.addHeading('P0 production deployment guard');
            core.summary.addRaw(`Candidate Render workflow run: ${run.id}\n`);
            core.summary.addRaw(`Candidate SHA: ${run.head_sha}\n`);
            core.summary.addRaw('P0/2 credential rotation: explicit operator risk acceptance; rotation deferred.\n');
            core.summary.addRaw('P0/3 NAV TEST UAT: explicit operator deferral; issue #212 remains open and non-blocking.\n');

            if (!governanceFailures.length && !p0Failures.length) {
              core.summary.addRaw('All blocking production controls are proven closed or explicitly risk-accepted/deferred. Render deploy is allowed.\n');
              await core.summary.write();
              return;
            }

            if (!governanceFailures.length && remediation) {
              core.summary.addHeading('Controlled P0 remediation deploy allowed', 2);
              core.summary.addRaw('The commit is explicitly marked `[p0-remediation]` and every changed file is in the audited remediation allowlist.\n');
              core.summary.addList(remediationFiles);
              if (p0Failures.length) {
                core.summary.addHeading('P0 controls still open', 3).addList(p0Failures);
              }
              await core.summary.write();
              return;
            }

            const failures = [...governanceFailures, ...p0Failures];
            core.summary.addHeading('Deployment blocked', 2).addList(failures);
            if (remediationFiles.length) {
              core.summary.addHeading('Candidate files', 3).addList(remediationFiles);
            }
            await core.summary.write();

            if (run.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              core.notice(`Cancelled unsafe Render deploy workflow run ${run.id}`);
            }

            core.setFailed(`Production deploy blocked by ${failures.length} unresolved control(s).`);
