name: Booking 4 recommendation attribution
on:
  push:
    branches: [feature/booking-4-growth]
    paths: [.github/workflows/booking-v4-growth-attribution.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-growth
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/bookingV4Growth.ts');s=p.read_text()
          old="LEFT JOIN LATERAL(SELECT count(*) views FROM booking_funnel_events e WHERE e.recommendation_id=r.id AND e.event_name='recommendation_viewed' AND e.created_at>=now()-($2::text||' days')::interval)v ON true LEFT JOIN LATERAL(SELECT count(*) clicks FROM booking_funnel_events e WHERE e.recommendation_id=r.id AND e.event_name='recommendation_clicked' AND e.created_at>=now()-($2::text||' days')::interval)c ON true LEFT JOIN LATERAL(SELECT count(*) bookings FROM booking_funnel_events e WHERE e.recommendation_id=r.id AND e.event_name='booking_completed' AND e.created_at>=now()-($2::text||' days')::interval)b ON true"
          new="LEFT JOIN LATERAL(SELECT count(DISTINCT e.session_id) views FROM booking_funnel_events e WHERE e.recommendation_id=r.id AND e.event_name='recommendation_viewed' AND e.created_at>=now()-($2::text||' days')::interval)v ON true LEFT JOIN LATERAL(SELECT count(DISTINCT e.session_id) clicks FROM booking_funnel_events e WHERE e.recommendation_id=r.id AND e.event_name='recommendation_clicked' AND e.created_at>=now()-($2::text||' days')::interval)c ON true LEFT JOIN LATERAL(SELECT count(DISTINCT e.session_id) bookings FROM booking_funnel_events e WHERE e.recommendation_id=r.id AND e.event_name='recommendation_clicked' AND e.created_at>=now()-($2::text||' days')::interval AND EXISTS(SELECT 1 FROM booking_funnel_events bfe WHERE bfe.session_id=e.session_id AND bfe.event_name='booking_completed' AND bfe.created_at>=e.created_at AND bfe.created_at<e.created_at+interval '1 day'))b ON true"
          if old not in s: raise SystemExit('attribution anchor missing')
          s=s.replace(old,new,1);p.write_text(s)
          PY
      - run: grep -q 'count(DISTINCT e.session_id) bookings' src/routes/bookingV4Growth.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/routes/bookingV4Growth.ts
          git diff --cached --quiet || (git commit -m "fix(booking-v4): attribute recommendation conversions by session" && git push origin HEAD:feature/booking-4-growth)
# trigger
