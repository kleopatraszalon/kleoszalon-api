name: Voice Booking AI cost live UAT
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/uat/booking-voice-ai-cost-live.mjs'
      - '.github/workflows/booking-voice-ai-cost-live-uat.yml'
  workflow_dispatch:

jobs:
  live-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Voice Booking AI cost live UAT
        env:
          UAT_API_BASE: https://kleoszalon-api-1.onrender.com
          UAT_ADMIN_IDENTIFIER: admin1
          UAT_ADMIN_PASSWORD: Teszt1234!
        run: node scripts/uat/booking-voice-ai-cost-live.mjs
