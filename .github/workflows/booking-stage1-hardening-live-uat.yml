name: Booking stage1 hardening live UAT

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/uat/booking-stage1-hardening-live.mjs'
      - '.github/workflows/booking-stage1-hardening-live-uat.yml'
  workflow_dispatch:

concurrency:
  group: booking-stage1-hardening-live-uat
  cancel-in-progress: false

jobs:
  live-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Second run intentionally gives Render's main-branch deployment time to settle.
      - name: Run live hardening UAT with cleanup
        env:
          UAT_API_BASE: https://kleoszalon-api-1.onrender.com
          UAT_FRONTEND_BASE: https://kleoszalon-frontend.onrender.com
          UAT_ADMIN_IDENTIFIER: admin1
          UAT_ADMIN_PASSWORD: Teszt1234!
          UAT_CUSTOMER_IDENTIFIER: ugyfel1
          UAT_CUSTOMER_PASSWORD: Teszt1234!
        run: node scripts/uat/booking-stage1-hardening-live.mjs
