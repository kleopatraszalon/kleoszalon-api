name: Cashier stage13 integration

on:
  pull_request:
    paths:
      - 'src/routes/cashierShift.ts'
      - 'src/services/cashierClosePdf.ts'
      - 'src/routes/transactions.ts'
      - 'src/middleware/workOrderFinanceScope.ts'
      - 'tests/cashier_stage13.integration.js'
      - '.github/workflows/cashier-stage13-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/cashierShift.ts'
      - 'src/services/cashierClosePdf.ts'
      - 'src/routes/transactions.ts'
      - 'src/middleware/workOrderFinanceScope.ts'
      - 'tests/cashier_stage13.integration.js'
      - '.github/workflows/cashier-stage13-integration.yml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_cashier_stage13
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_cashier_stage13"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kleo_cashier_stage13
      PGSSL: off
      JWT_SECRET: cashier_stage13_secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build API
        run: npm run build
      - name: Create cashier integration schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workorder_stage8_integration_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/sql/20260807_CASHIER_FINANCIAL_CLOSE_V1.sql
      - name: Run cashier stage13 integration
        run: node tests/cashier_stage13.integration.js
