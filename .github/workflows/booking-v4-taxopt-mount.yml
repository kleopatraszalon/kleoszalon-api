name: Booking taxonomy optimizer mount
on:
  push:
    branches: [feature/booking-4-taxonomy-optimizer]
    paths: [.github/workflows/booking-v4-taxopt-mount.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-taxonomy-optimizer
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts');s=p.read_text()
          if 'bookingV4TaxonomyOptimizerRouter' not in s:
            a='import{bookingV4GrowthPublicRouter,bookingV4GrowthAdminRouter}from"./routes/bookingV4Growth";'
            s=s.replace(a,a+'import bookingV4TaxonomyOptimizerRouter from"./routes/bookingV4TaxonomyOptimizer";',1)
            m='app.use("/api/admin/booking-v4",requireManagement,bookingV4GrowthAdminRouter);'
            s=s.replace(m,m+'app.use("/api/admin/booking-v4",requireManagement,bookingV4TaxonomyOptimizerRouter);',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/server.ts
          git diff --cached --quiet || (git commit -m "feat(booking-v4): mount taxonomy optimizer" && git push origin HEAD:feature/booking-4-taxonomy-optimizer)
# trigger