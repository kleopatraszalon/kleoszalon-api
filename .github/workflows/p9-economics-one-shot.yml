name: P9 paid-ledger one-shot patch
on:
  push:
    branches: [feature/vir-p9-marketing-automation]
    paths: ['.github/workflows/p9-economics-one-shot.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/vir-p9-marketing-automation}
      - name: Escape generated template interpolation
        run: sed -i 's/${r.top_service}/\\${r.top_service}/g' scripts/apply-p9-economics-patch.cjs
      - run: node scripts/apply-p9-economics-patch.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: use paid-ledger economics and campaign touch tracking'
          git push origin HEAD:feature/vir-p9-marketing-automation
