name: Booking 4 chain-book rebase mount
on:
  push:
    branches: [feature/booking-4-chain-book]
    paths: [.github/workflows/booking-v4-chain-book-rebase-mount.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-chain-book
      - name: Mount atomic chain-book router on current main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts');s=p.read_text()
          if 'bookingV4ChainBookRouter' not in s:
            old='import bookingV4Router from"./routes/bookingV4";import bookingV4ChainRouter from"./routes/bookingV4Chain";import bookingV4AdminRouter from"./routes/bookingV4Admin";'
            new='import bookingV4Router from"./routes/bookingV4";import bookingV4ChainRouter from"./routes/bookingV4Chain";import bookingV4ChainBookRouter from"./routes/bookingV4ChainBook";import bookingV4AdminRouter from"./routes/bookingV4Admin";'
            if old not in s: raise SystemExit('import anchor not found')
            s=s.replace(old,new,1)
            old2='app.use("/api/public/booking",bookingV4ChainRouter);app.use("/api/public/booking",bookingV4Router);'
            new2='app.use("/api/public/booking",bookingV4ChainBookRouter);app.use("/api/public/booking",bookingV4ChainRouter);app.use("/api/public/booking",bookingV4Router);'
            if old2 not in s: raise SystemExit('mount anchor not found')
            s=s.replace(old2,new2,1);p.write_text(s)
          PY
      - run: grep -q bookingV4ChainBookRouter src/server.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/server.ts
          git diff --cached --quiet || (git commit -m "feat(booking-v4): mount atomic chain booking on current main" && git push origin HEAD:feature/booking-4-chain-book)
# retrigger-1
