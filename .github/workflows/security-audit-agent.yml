name: Security audit agent
on:
  push:
    branches:
      - agent/security-regression-hardening-20260814
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --json || true
      - name: Full dependency audit
        run: npm audit --json || true
