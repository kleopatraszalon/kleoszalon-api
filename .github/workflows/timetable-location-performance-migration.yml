name: Timetable location performance migration
on:
  push:
    branches:
      - agent/security-regression-hardening-20260814
    paths:
      - .github/workflows/timetable-location-performance-migration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-regression-hardening-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Scope timetable queries by location
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/timetable.ts')
          s=p.read_text(encoding='utf-8')
          old='''router.get("/", async (req: AuthRequest, res) => {\n  const { from, to } = req.query as any;'''
          new='''router.get("/", async (req: AuthRequest, res) => {\n  const { from, to } = req.query as any;\n  const locationId = String(req.query.location_id || "").trim() || null;'''
          if old not in s: raise SystemExit('route anchor not found')
          s=s.replace(old,new,1)
          old2='''    const cols = await loadEmployeesCols();\n    const employeesSql = buildEmployeesSelect(cols);\n    const employeesRes = await pool.query(employeesSql);'''
          new2='''    const cols = await loadEmployeesCols();\n    const employeesSql = buildEmployeesSelect(cols);\n    const employeesRes = locationId\n      ? await pool.query(`SELECT * FROM (${employeesSql}) scoped_employees WHERE location_id=$1::uuid`, [locationId])\n      : await pool.query(employeesSql);'''
          if old2 not in s: raise SystemExit('employee query anchor not found')
          s=s.replace(old2,new2,1)
          old3='''      WHERE a.start_time >= ($1::date)::timestamp\n        AND a.start_time <  (($2::date + INTERVAL '1 day')::timestamp)\n      ORDER BY a.start_time ASC\n      `,\n      [from, to]\n    );'''
          new3='''      WHERE a.start_time >= ($1::date)::timestamp\n        AND a.start_time <  (($2::date + INTERVAL '1 day')::timestamp)\n        AND ($3::uuid IS NULL OR a.location_id=$3::uuid)\n      ORDER BY a.start_time ASC\n      `,\n      [from, to, locationId]\n    );'''
          if old3 not in s: raise SystemExit('appointment query anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
      - name: Clean install
        run: npm ci --no-fund --no-audit
      - name: Regression gate
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/regression.log
          tests=$(grep -E '^# tests [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          passed=$(grep -E '^# pass [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          failed=$(grep -E '^# fail [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          test "$tests" = "320" && test "$passed" = "320" && test "${failed:-1}" = "0"
      - name: TypeScript production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified timetable optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/timetable.ts
          git diff --cached --quiet && exit 0
          git commit -m "perf: scope timetable queries to selected location"
          git push origin HEAD:agent/security-regression-hardening-20260814
