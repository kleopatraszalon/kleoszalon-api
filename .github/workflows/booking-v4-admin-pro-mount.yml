name: Booking 4 admin pro mount
on:
  push:
    branches: [feature/booking-4-admin-pro]
    paths: [.github/workflows/booking-v4-admin-pro-mount.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-admin-pro
      - name: Mount Booking 4 admin pro router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts');s=p.read_text()
          if 'bookingV4AdminProRouter' not in s:
            old='import bookingV4ChainAdminRouter from"./routes/bookingV4ChainAdmin";import bookingV4AdminRouter from"./routes/bookingV4Admin";'
            new='import bookingV4ChainAdminRouter from"./routes/bookingV4ChainAdmin";import bookingV4AdminProRouter from"./routes/bookingV4AdminPro";import bookingV4AdminRouter from"./routes/bookingV4Admin";'
            if old not in s: raise SystemExit('import anchor not found')
            s=s.replace(old,new,1)
            old2='app.use("/api/admin/booking-v4",requireManagement,bookingV4ChainAdminRouter);app.use("/api/admin/booking-v4",requireManagement,bookingV4AdminRouter);'
            new2='app.use("/api/admin/booking-v4",requireManagement,bookingV4AdminProRouter);app.use("/api/admin/booking-v4",requireManagement,bookingV4ChainAdminRouter);app.use("/api/admin/booking-v4",requireManagement,bookingV4AdminRouter);'
            if old2 not in s: raise SystemExit('mount anchor not found')
            s=s.replace(old2,new2,1);p.write_text(s)
          PY
      - run: grep -q bookingV4AdminProRouter src/server.ts
      - name: Commit mount
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/server.ts
          git diff --cached --quiet || (git commit -m "feat(booking-v4): mount professional admin API" && git push origin HEAD:feature/booking-4-admin-pro)
# retrigger
