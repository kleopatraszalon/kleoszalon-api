name: Render deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  automated-quality-gate:
    name: Unit / integration / E2E / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit, integration and contract tests
        run: npm test

      - name: TypeScript production build
        run: npm run build

  deploy:
    name: Manual approval + production deploy
    needs: automated-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this GitHub Environment with required reviewers. GitHub then
    # blocks this job until a human explicitly approves the production release.
    environment: production-manual-approval
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Trigger Render API deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS --retry 3 --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for deployed API, readiness and WallBoard feed
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          live=0
          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 20 "$API_BASE_URL/api/health" 2>/dev/null || true)"
            ready="$(curl -fsS --max-time 20 "$API_BASE_URL/api/health/ready" 2>/dev/null || true)"
            wallboard="$(curl -fsS --max-time 20 "$API_BASE_URL/api/signage/wallboard/daily-action.json" 2>/dev/null || true)"

            if HEALTH="$health" READY="$ready" WALLBOARD="$wallboard" node - <<'NODE'
          const health = JSON.parse(process.env.HEALTH || '{}');
          const ready = JSON.parse(process.env.READY || '{}');
          const wallboard = JSON.parse(process.env.WALLBOARD || '{}');
          const ok = health.ok === true && health.db?.ok === true
            && ready.ok === true
            && wallboard.version === '1.0'
            && Object.prototype.hasOwnProperty.call(wallboard, 'action');
          process.exit(ok ? 0 : 1);
          NODE
            then
              live=1
              printf '%s\n' "$ready" > /tmp/ready.json
              printf '%s\n' "$wallboard" > /tmp/wallboard.json
              break
            fi

            echo "Waiting for new Render release markers ($attempt/60)..."
            sleep 10
          done

          if [ "$live" -ne 1 ]; then
            echo "New Render API release did not expose health/readiness/WallBoard markers."
            exit 1
          fi

          node -e "const x=require('/tmp/ready.json'); console.log('API readiness PASS; single-instance-failure-ready=',!!x.single_instance_failure_ready)"
          node -e "const x=require('/tmp/wallboard.json'); console.log('WallBoard feed PASS; active-action=',!!x.action)"

      - name: Verify cashier API authentication boundary
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/cashier-response.txt -w '%{http_code}' "$API_BASE_URL/api/transactions/cashier/shift/current?date=2026-08-13&location_id=render-smoke")"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "Unexpected unauthenticated cashier status: $code"
            cat /tmp/cashier-response.txt
            exit 1
          fi
          echo "Cashier authentication boundary PASS ($code)"

      - name: Render deploy hook is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_API_DEPLOY_HOOK_URL secret is not configured; Render deploy skipped."
