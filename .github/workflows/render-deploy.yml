name: Render deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: render-production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-quality-gate:
    name: Unit / integration / E2E / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_uat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d saas_uat"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGPASSWORD: postgres
      SAAS_UAT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saas_uat
      PGSSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Financial integrity gate
        run: npm run test:financial-integrity
      - name: Workorder regression gate
        run: npm run test:workorders
      - name: Requirements quality gate
        run: npm run requirements:check
      - name: Prepare isolated SaaS tenant schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$SAAS_UAT_DATABASE_URL" <<'SQL'
          CREATE TABLE users(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), role text);
          CREATE TABLE locations(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), name text NOT NULL, city text, address text, is_active boolean DEFAULT true);
          CREATE TABLE clients(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), full_name text, location_id uuid REFERENCES locations(id));
          CREATE TABLE employees(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), full_name text, location_id uuid REFERENCES locations(id));
          CREATE TABLE appointments(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), location_id uuid REFERENCES locations(id), client_id uuid, employee_id uuid, start_time timestamptz DEFAULT now(), end_time timestamptz DEFAULT now()+interval '1 hour');
          CREATE TABLE work_orders(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), location_id uuid REFERENCES locations(id), client_id uuid, employee_id uuid, status text DEFAULT 'open');
          CREATE TABLE product_stock_balances(id bigserial PRIMARY KEY, location_id uuid REFERENCES locations(id));
          CREATE TABLE purchase_orders(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), location_id uuid REFERENCES locations(id));
          SQL
          psql "$SAAS_UAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/sql/20260816_SAAS_CORE_V1.sql
          psql "$SAAS_UAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/sql/20260816_SAAS_TENANT_ISOLATION_V2.sql
      - name: SaaS cross-tenant isolation gate
        run: npm run test:saas-isolation
      - name: TypeScript production build
        run: npm run build
      - name: Mark backend release verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Quality gate passed; exact Render release verification pending",context:"release-control/render-backend"}))')"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

  deploy:
    name: Automatic exact-SHA production deploy
    needs: automated-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Setup Node for live UAT
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Render API deploy hook
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_DEPLOY_HOOK_URL:-}" || { echo "RENDER_API_DEPLOY_HOOK_URL secret is not configured." >&2; exit 1; }
      - name: Trigger exact Render API commit
        shell: bash
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl -fsS --retry 3 --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${GITHUB_SHA}"
      - name: Wait for healthy Render service
        shell: bash
        run: |
          set -euo pipefail
          live=0
          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 20 "$API_BASE_URL/api/health" 2>/dev/null || true)"
            ready="$(curl -fsS --max-time 20 "$API_BASE_URL/api/health/ready" 2>/dev/null || true)"
            wallboard="$(curl -fsS --max-time 20 "$API_BASE_URL/api/signage/wallboard/daily-action.json" 2>/dev/null || true)"
            rm -f /tmp/daily-headers.txt /tmp/daily-body.txt
            daily_code="$(curl -sS --max-time 20 -D /tmp/daily-headers.txt -o /tmp/daily-body.txt -w '%{http_code}' "$API_BASE_URL/api/public/marketing/daily-actions" || true)"
            daily_marker="$(tr -d '\r' < /tmp/daily-headers.txt 2>/dev/null | awk -F': ' 'tolower($1)=="x-kleo-hotfix"{print $2}' | tail -1)"
            if HEALTH="$health" READY="$ready" WALLBOARD="$wallboard" DAILY_CODE="$daily_code" DAILY_MARKER="$daily_marker" node - <<'NODE'
          const health=JSON.parse(process.env.HEALTH||'{}'), ready=JSON.parse(process.env.READY||'{}'), wallboard=JSON.parse(process.env.WALLBOARD||'{}');
          const dailyMarker=process.env.DAILY_MARKER||'';
          const dailyHealthy=/^api500-daily-actions-(?:v1|v2)$/.test(dailyMarker);
          const ok=health.ok===true&&health.db?.ok===true&&ready.ok===true&&wallboard.version==='1.0'&&Object.prototype.hasOwnProperty.call(wallboard,'action')&&process.env.DAILY_CODE==='200'&&dailyHealthy;
          process.exit(ok?0:1);
          NODE
            then
              live=1; printf '%s\n' "$ready" >/tmp/ready.json; printf '%s\n' "$wallboard" >/tmp/wallboard.json; break
            fi
            echo "Waiting for healthy Render service ($attempt/60): daily=$daily_code marker=${daily_marker:-missing}"; sleep 10
          done
          test "$live" -eq 1 || { echo "Render API did not become healthy after deploy trigger." >&2; exit 1; }
      - name: Verify cashier API authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/cashier-response.txt -w '%{http_code}' "$API_BASE_URL/api/transactions/cashier/shift/current?date=2026-08-13&location_id=render-smoke")"
          [[ "$code" = "401" || "$code" = "403" ]] || { echo "Unexpected unauthenticated cashier status: $code"; cat /tmp/cashier-response.txt; exit 1; }

      - name: Verify exact backend SHA and publish non-integration evidence
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({expected_release_ref:process.env.GITHUB_SHA,entries:[{key:"tests.backend",status:"pass",evidence:"npm test + requirements quality gate PASS"},{key:"build.backend",status:"pass",evidence:"TypeScript production build PASS"},{key:"tests.financial",status:"pass",evidence:"Financial integrity gate PASS"},{key:"tests.saas",status:"pass",evidence:"PostgreSQL 16 cross-tenant isolation UAT PASS"},{key:"tests.rbac",status:"pass",evidence:"RBAC fail-closed regression included in backend test suite PASS"}]}))')"
          accepted=0
          for attempt in $(seq 1 90); do
            response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
            oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
            test -n "$oidc"
            rm -f /tmp/release-evidence.json
            code="$(curl -sS --max-time 30 -o /tmp/release-evidence.json -w '%{http_code}' -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' --data "$payload" "$API_BASE_URL/api/uat/release-control/evidence" || true)"
            if [ "$code" = "200" ]; then accepted=1; echo "Non-integration evidence accepted for exact running SHA $GITHUB_SHA"; cat /tmp/release-evidence.json; break; fi
            if [ "$code" = "409" ]; then
              current="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/release-evidence.json','utf8'));process.stdout.write(String(x.current_release_ref||''))}catch{}")"
              echo "Waiting for exact Render SHA ($attempt/90): expected=$GITHUB_SHA current=${current:-unknown}"; sleep 10; continue
            fi
            echo "Release evidence submission failed with HTTP $code" >&2; cat /tmp/release-evidence.json >&2 || true; exit 1
          done
          test "$accepted" -eq 1 || { echo "Render did not expose workflow commit $GITHUB_SHA within 15 minutes." >&2; cat /tmp/release-evidence.json >&2 || true; exit 1; }

      - name: Controlled exact-SHA production booking UAT
        env:
          BOOKING_UAT_BASE: https://kleoszalon-api-1.onrender.com/api/public/marketing/booking
          BOOKING_UAT_EMAIL: vir-booking-uat@example.com
        run: node tests/booking_live_uat.mjs

      - name: Publish exact-SHA integration evidence after live UAT
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({expected_release_ref:process.env.GITHUB_SHA,entries:[{key:"tests.integration",status:"pass",evidence:"Exact-SHA Render health/readiness/WallBoard/cashier boundary + controlled production booking create/collision/reschedule/readback/cancel/cleanup UAT PASS"}]}))')"
          accepted=0
          for attempt in $(seq 1 30); do
            response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
            oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
            test -n "$oidc"
            rm -f /tmp/integration-evidence.json
            code="$(curl -sS --max-time 30 -o /tmp/integration-evidence.json -w '%{http_code}' -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' --data "$payload" "$API_BASE_URL/api/uat/release-control/evidence" || true)"
            if [ "$code" = "200" ]; then accepted=1; echo "Integration evidence accepted for exact running SHA $GITHUB_SHA"; cat /tmp/integration-evidence.json; break; fi
            if [ "$code" = "409" ]; then
              current="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/integration-evidence.json','utf8'));process.stdout.write(String(x.current_release_ref||''))}catch{}")"
              echo "Render rollout still mixed after live UAT ($attempt/30): expected=$GITHUB_SHA current=${current:-unknown}"; sleep 5; continue
            fi
            echo "Integration evidence submission failed with HTTP $code" >&2; cat /tmp/integration-evidence.json >&2 || true; exit 1
          done
          test "$accepted" -eq 1 || { echo "Exact-SHA integration evidence was not accepted after rollout convergence." >&2; cat /tmp/integration-evidence.json >&2 || true; exit 1; }

      - name: Mark exact backend release verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Exact Render SHA, live booking UAT and Release Control evidence verified",context:"release-control/render-backend"}))')"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
      - name: Mark backend release verification failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Exact Render SHA, live UAT or Release Control evidence verification failed",context:"release-control/render-backend"}))')"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
