name: Kleoshop production catalog verification

on:
  push:
    branches: [main]
    paths:
      - 'src/data/kleoshop-catalog.json'
      - 'src/catalog/syncKleoshopCatalog.ts'
      - 'src/dbMigrations.ts'
      - 'src/routes/publicWebshopSecure.ts'
      - 'src/routes/releaseControlOidc.ts'
      - '.github/workflows/kleoshop-production-catalog-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Mark production catalog verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Verifying complete 511-product production catalog",context:"kleoshop/production-catalog"}))')"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Run secured production catalog sync on exact release
        shell: bash
        env:
          SYNC_URL: https://kleoszalon-api-1.onrender.com/api/uat/release-control/catalog-sync
        run: |
          set -euo pipefail
          synced=0
          payload="$(node -e 'process.stdout.write(JSON.stringify({expected_release_ref:process.env.GITHUB_SHA}))')"
          for attempt in $(seq 1 90); do
            response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
            oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
            test -n "$oidc"
            rm -f /tmp/catalog-sync.json
            code="$(curl -sS --max-time 60 -o /tmp/catalog-sync.json -w '%{http_code}' \
              -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
              --data "$payload" "$SYNC_URL" || true)"
            if [ "$code" = "200" ]; then
              echo 'Production catalog sync PASS:'
              cat /tmp/catalog-sync.json
              synced=1
              break
            fi
            if [ "$code" = "404" ] || [ "$code" = "409" ]; then
              echo "Waiting for exact backend catalog-sync endpoint ($attempt/90; HTTP $code)"
              cat /tmp/catalog-sync.json 2>/dev/null || true
              sleep 10
              continue
            fi
            echo "Production catalog sync failed with HTTP ${code:-network-error}:" >&2
            cat /tmp/catalog-sync.json >&2 || true
            exit 1
          done
          test "$synced" -eq 1 || { echo 'Exact production catalog sync did not become available.' >&2; exit 1; }

      - name: Wait for exact production catalog
        shell: bash
        env:
          STATUS_URL: https://kleoszalon-api-1.onrender.com/api/public/webshop/catalog-status
          EXPECTED: '511'
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 90); do
            code="$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/catalog.json -w '%{http_code}' "${STATUS_URL}?verify=${GITHUB_SHA}-${attempt}" || true)"
            if [ "$code" = "200" ]; then
              if node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const expected=Number(process.env.EXPECTED);
          const keys=['total','visible','retail','priced','distinct_urls'];
          if(x.ok===true && Number(x.expected)===expected && keys.every(k=>Number(x[k])===expected)){
            console.log(JSON.stringify(x,null,2));
            process.exit(0);
          }
          console.error('Catalog not complete yet:',x);
          process.exit(1);
          NODE
              then
                ok=1
                break
              fi
            else
              echo "Production catalog not ready ($attempt/90; HTTP ${code:-network-error})."
              cat /tmp/catalog.json 2>/dev/null || true
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Production did not expose the complete 511-product Kleoshop catalog.' >&2
            exit 1
          fi

      - name: Verify public webshop product feed contains all source products
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
            'https://kleoszalon-api-1.onrender.com/api/public/webshop/products?catalog_verify=1' \
            -o /tmp/products.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/products.json','utf8'));
          const rows=Array.isArray(body)?body:(Array.isArray(body.items)?body.items:[]);
          const valid=rows.filter(p=>p && p.web_is_visible!==false && Number(p.retail_price_gross||p.sale_price||0)>0);
          if(valid.length<511) throw new Error(`Public feed has only ${valid.length} valid visible products; expected at least 511.`);
          console.log(`Public webshop feed PASS: ${valid.length} valid visible products.`);
          NODE

      - name: Mark production catalog verified
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"511/511 production catalog and public feed verified",context:"kleoshop/production-catalog"}))')"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark production catalog verification failed
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"511-product production catalog verification failed",context:"kleoshop/production-catalog"}))')"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -X POST --data "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
