name: Sync package lockfile

on:
  push:
    branches:
      - fix/sync-xlsx-lockfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sync-xlsx-lockfile

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci --include=dev --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git commit -m "Sync package-lock with XLSX dependency"
          git push origin HEAD:fix/sync-xlsx-lockfile
