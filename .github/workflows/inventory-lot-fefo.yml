name: Inventory lot expiry FEFO

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_fefo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_fefo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kleo_fefo_test
      PGSSL: off
      JWT_SECRET: fefo_secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build API
        run: npm run build
      - name: Create inventory test schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workorder_stage8_integration_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workorder_stage10_supply_schema.sql
      - name: Run lot expiry FEFO integration
        run: node tests/inventory_lot_fefo.integration.js
      - name: Generate FEFO requirement evidence
        if: success()
        run: node scripts/generate-fefo-requirement-evidence.mjs
      - name: Upload FEFO requirement evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-evidence-fefo-${{ github.sha }}
          path: artifacts/requirements-evidence-fefo.json
          retention-days: 90
