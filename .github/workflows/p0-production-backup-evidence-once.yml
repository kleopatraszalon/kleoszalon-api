name: P0 production backup evidence once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-production-backup-evidence-once.yml'

permissions:
  contents: read
  issues: write
  id-token: write
  statuses: write

jobs:
  production-backup-restore-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_restore_target
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_restore_target"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kleo_restore_target
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
      PG_CLIENT_DOCKER_IMAGE: postgres:17
    steps:
      - name: Mark production backup evidence pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'p0/production-backup-evidence',
              description: 'Running snapshot-consistent PostgreSQL 17 backup and restore',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Verify PostgreSQL 17 client image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect postgres:17 >/dev/null
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version

      - name: Resolve production source without exposing secret
        id: source
        shell: bash
        env:
          PRODUCTION_BACKUP_SOURCE: ${{ secrets.BACKUP_SOURCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_BACKUP_SOURCE:-}" ]; then
            echo "BACKUP_SOURCE_DATABASE_URL is not configured" >&2
            exit 1
          fi
          echo "::add-mask::${PRODUCTION_BACKUP_SOURCE}"
          echo "url=${PRODUCTION_BACKUP_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Run snapshot-consistent production dump, isolated restore and consistency checks
        env:
          SOURCE_DATABASE_URL: ${{ steps.source.outputs.url }}
          BACKUP_EVIDENCE_ENVIRONMENT: production-backup-isolated-restore
        run: node tests/backup_restore_rehearsal.mjs

      - name: Upload production backup restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-production-backup-restore-${{ github.sha }}
          path: evidence/requirements-evidence-backup-restore.json
          retention-days: 90

      - name: Publish production restore evidence to Release Control Center
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
          oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$oidc"
          payload="$(node -e 'process.stdout.write(JSON.stringify({entries:[{key:"backup.restore",status:"pass",evidence:"Production PostgreSQL 17 exported-snapshot dump + isolated restore + snapshot-consistent table/row verification PASS"}]}))')"
          curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$API_BASE_URL/api/uat/release-control/evidence"

      - name: Close P0 backup issue after successful evidence
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = 270;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Production PostgreSQL 17 exported-snapshot backup + isolated restore + snapshot-consistent table/row evidence PASS: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. P0/1 closed with production evidence.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

  publish-result:
    if: ${{ always() }}
    needs: production-backup-restore-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Publish final production backup evidence status
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.production-backup-restore-evidence.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'p0/production-backup-evidence',
              description: passed
                ? 'Snapshot-consistent PostgreSQL 17 production backup + restore PASS'
                : 'Production backup evidence FAILED; P0 remains open',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!passed) core.setFailed('Production backup evidence did not pass.');
