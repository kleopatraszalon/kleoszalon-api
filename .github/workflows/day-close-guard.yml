name: Day close requirement guard

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_day_close_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_day_close_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kleo_day_close_test
      PGSSL: off
      JWT_SECRET: day_close_secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build API
        run: npm run build
      - name: Create day close test schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workorder_stage8_integration_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/sql/20260807_CASHIER_FINANCIAL_CLOSE_V1.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/sql/20260816_DAY_CLOSE_GUARD_V1.sql
      - name: Run day close integration
        run: node tests/day_close_guard.integration.js
      - name: Generate day close requirement evidence
        if: success()
        run: node scripts/generate-day-close-requirement-evidence.mjs
      - name: Upload day close requirement evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-evidence-day-close-${{ github.sha }}
          path: artifacts/requirements-evidence-day-close.json
          retention-days: 90
