name: Booking stage15 integration

on:
  pull_request:
    paths:
      - 'src/routes/bookingOperations.ts'
      - 'src/routes/bookingOperationsCore.ts'
      - 'src/routes/bookingAdvanced.ts'
      - 'src/services/bookingWorkOrder.ts'
      - 'tests/booking-resources-4hands-stage15.contract.test.js'
      - 'tests/booking_stage15.integration.js'
      - '.github/workflows/booking-stage15-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/bookingOperations.ts'
      - 'src/routes/bookingOperationsCore.ts'
      - 'src/routes/bookingAdvanced.ts'
      - 'src/services/bookingWorkOrder.ts'
      - 'tests/booking-resources-4hands-stage15.contract.test.js'
      - 'tests/booking_stage15.integration.js'
      - '.github/workflows/booking-stage15-integration.yml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_booking_stage15
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_booking_stage15"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kleo_booking_stage15
      PGSSL: off
      JWT_SECRET: booking_stage15_secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build API
        run: npm run build
      - name: Create booking integration schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workorder_stage8_integration_schema.sql
      - name: Run booking stage15 integration
        run: node tests/booking_stage15.integration.js
