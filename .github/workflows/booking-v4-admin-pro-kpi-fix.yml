name: Booking 4 admin pro KPI filter fix
on:
  push:
    branches: [feature/booking-4-admin-pro]
    paths: [.github/workflows/booking-v4-admin-pro-kpi-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-admin-pro
      - name: Apply location filters to KPI queries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/bookingV4AdminPro.ts');s=p.read_text()
          s=s.replace("(SELECT count(*)::int FROM appointments a WHERE a.start_time::date=current_date AND lower(COALESCE(a.status,'')) NOT IN('cancelled','canceled')) bookings_today,", "(SELECT count(*)::int FROM appointments a WHERE a.start_time::date=current_date AND lower(COALESCE(a.status,'')) NOT IN('cancelled','canceled') AND ($1::uuid IS NULL OR a.location_id=$1::uuid)) bookings_today,",1)
          s=s.replace("(SELECT count(*)::int FROM appointments a WHERE lower(COALESCE(a.status,''))='pending') pending_bookings,", "(SELECT count(*)::int FROM appointments a WHERE lower(COALESCE(a.status,''))='pending' AND ($1::uuid IS NULL OR a.location_id=$1::uuid)) pending_bookings,",1)
          s=s.replace("(SELECT count(*)::int FROM booking_coupon_redemptions r WHERE r.created_at>=now()-($2::text||' days')::interval) coupon_redemptions,", "(SELECT count(*)::int FROM booking_coupon_redemptions r JOIN appointments a ON a.id=r.appointment_id WHERE r.created_at>=now()-($2::text||' days')::interval AND ($1::uuid IS NULL OR a.location_id=$1::uuid)) coupon_redemptions,",1)
          s=s.replace("(SELECT COALESCE(sum(r.discount_amount),0)::numeric FROM booking_coupon_redemptions r WHERE r.created_at>=now()-($2::text||' days')::interval) coupon_discount_value,", "(SELECT COALESCE(sum(r.discount_amount),0)::numeric FROM booking_coupon_redemptions r JOIN appointments a ON a.id=r.appointment_id WHERE r.created_at>=now()-($2::text||' days')::interval AND ($1::uuid IS NULL OR a.location_id=$1::uuid)) coupon_discount_value,",1)
          p.write_text(s)
          PY
      - run: grep -q "pending' AND (\$1::uuid IS NULL OR a.location_id=\$1::uuid)" src/routes/bookingV4AdminPro.ts
      - name: Commit KPI filter fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/routes/bookingV4AdminPro.ts
          git diff --cached --quiet || (git commit -m "fix(booking-v4): scope dashboard KPIs by salon" && git push origin HEAD:feature/booking-4-admin-pro)
