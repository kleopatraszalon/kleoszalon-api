name: Frontend cross-repo requirement evidence v20
on:
  pull_request:
    paths:
      - 'docs/requirements/**'
      - 'tests/frontend_crossrepo_v20.evidence.mjs'
      - '.github/workflows/frontend-crossrepo-v20.yml'
      - 'scripts/validate-requirement-automation.mjs'
      - 'scripts/generate-requirement-evidence.mjs'
  workflow_dispatch:

jobs:
  frontend-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout API evidence repository
        uses: actions/checkout@v4
      - name: Checkout proven frontend revision
        uses: actions/checkout@v4
        with:
          repository: kleopatraszalon/kleoszalon-frontend
          ref: 8910bb509b116314bfd4eaff64090bc0198b0289
          path: frontend
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run KLEO v20 cross-repo acceptance evidence
        run: node tests/frontend_crossrepo_v20.evidence.mjs frontend
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
