name: Security secret rotation evidence

on:
  workflow_dispatch:
    inputs:
      evidence_reference:
        description: 'Non-secret change/ticket reference for the rotation'
        required: true
        type: string
      database_rotated:
        description: 'PostgreSQL/Render database credential rotated and Render updated'
        required: true
        default: false
        type: boolean
      smtp_rotated:
        description: 'SMTP credential rotated/replaced and Render updated'
        required: true
        default: false
        type: boolean
      jwt_rotated:
        description: 'JWT_SECRET rotated and existing sessions invalidated'
        required: true
        default: false
        type: boolean
      imap_credentials_reviewed:
        description: 'IMAP and complaint-mailbox credentials reviewed/rotated as needed'
        required: true
        default: false
        type: boolean
      external_api_credentials_reviewed:
        description: 'External API credentials reviewed/rotated as needed'
        required: true
        default: false
        type: boolean
      application_crypto_keys_reviewed:
        description: 'Application encryption/HMAC/tablet tokens reviewed/rotated as needed'
        required: true
        default: false
        type: boolean
      other_exposed_credentials_reviewed:
        description: 'All remaining credentials from historical env files reviewed/rotated as needed'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  rotation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
      EVIDENCE_REFERENCE: ${{ inputs.evidence_reference }}
    steps:
      - name: Checkout current protected source
        uses: actions/checkout@v4

      - name: Require complete operator attestation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.database_rotated }}" = "true"
          test "${{ inputs.smtp_rotated }}" = "true"
          test "${{ inputs.jwt_rotated }}" = "true"
          test "${{ inputs.imap_credentials_reviewed }}" = "true"
          test "${{ inputs.external_api_credentials_reviewed }}" = "true"
          test "${{ inputs.application_crypto_keys_reviewed }}" = "true"
          test "${{ inputs.other_exposed_credentials_reviewed }}" = "true"
          if [ ${#EVIDENCE_REFERENCE} -lt 5 ]; then
            echo 'A meaningful non-secret evidence reference is required.' >&2
            exit 1
          fi
          echo 'Complete non-secret provider-side rotation attestation accepted.'

      - name: Re-prove repository secret leak guard
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security-secret-leak-guard.js

      - name: Verify live API and database health after rotation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 "$API_BASE_URL/api/health" -o /tmp/health.json
          curl -fsS --retry 3 --max-time 30 "$API_BASE_URL/api/health/ready" -o /tmp/ready.json
          HEALTH="$(cat /tmp/health.json)" READY="$(cat /tmp/ready.json)" node - <<'NODE'
          const health=JSON.parse(process.env.HEALTH||'{}');
          const ready=JSON.parse(process.env.READY||'{}');
          if(health.ok!==true || health.db?.ok!==true || ready.ok!==true){
            console.error('Post-rotation API/DB readiness failed');
            process.exit(1);
          }
          console.log('Post-rotation API/DB readiness PASS');
          NODE

      - name: Record evidence and close security P0
        uses: actions/github-script@v7
        env:
          EVIDENCE_REFERENCE: ${{ inputs.evidence_reference }}
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const issue_number=62;
            const issue=await github.rest.issues.get({owner,repo,issue_number});
            const ref=String(process.env.EVIDENCE_REFERENCE||'').trim();
            if(ref.length<5){ core.setFailed('Meaningful non-secret evidence reference required.'); return; }
            const body=[
              'P0 credential-rotation closure evidence recorded.',
              `Evidence reference: ${ref}`,
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Head SHA: ${context.sha}`,
              '',
              '- PostgreSQL/Render DB credential rotation attested: YES',
              '- SMTP credential rotation/replacement attested: YES',
              '- JWT_SECRET rotation and session invalidation attested: YES',
              '- IMAP and complaint-mailbox credentials reviewed/rotated as needed: YES',
              '- External API credentials reviewed/rotated as needed: YES',
              '- Application encryption/HMAC/tablet tokens reviewed/rotated as needed: YES',
              '- Remaining historically exposed credentials reviewed/rotated as needed: YES',
              '- Repository secret leak guard: PASS',
              '- Live API + database readiness after rotation: PASS',
              '',
              'No secret values are stored in this evidence.'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number,body});
            if(issue.data.state!=='closed'){
              await github.rest.issues.update({owner,repo,issue_number,state:'closed',state_reason:'completed'});
            }
