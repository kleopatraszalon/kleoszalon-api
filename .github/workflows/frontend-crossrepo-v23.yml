name: Frontend cross-repo requirement evidence v23
on:
  pull_request:
    paths:
      - 'docs/requirements/**'
      - 'tests/frontend_crossrepo_v23.evidence.mjs'
      - 'tests/idle_auth_v23.contract.test.js'
      - '.github/workflows/frontend-crossrepo-v23.yml'
      - 'scripts/validate-requirement-automation.mjs'
      - 'scripts/generate-requirement-evidence.mjs'
  workflow_dispatch:

jobs:
  idle-session-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout API evidence repository
        uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout proven frontend revision
        uses: actions/checkout@v4
        with:
          repository: kleopatraszalon/kleoszalon-frontend
          ref: 8f9b6953507583f1bbfb385ea2b8ecca05e587a6
          path: frontend
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run KLEO v23 idle-session cross-repo evidence
        run: node api/tests/frontend_crossrepo_v23.evidence.mjs frontend
      - name: Production frontend build
        working-directory: frontend
        env:
          CI: false
        run: npm run build
