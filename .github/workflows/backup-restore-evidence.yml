name: Backup restore requirement evidence

on:
  pull_request:
    paths:
      - 'tests/backup_restore_rehearsal.mjs'
      - 'docs/requirements/**'
      - '.github/workflows/backup-restore-evidence.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-restore-evidence.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  restore-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_backup_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_backup_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCAL_SOURCE_URL: postgresql://postgres:postgres@localhost:5432/kleo_backup_fixture
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kleo_restore_target
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
      PG_CLIENT_DOCKER_IMAGE: postgres:17
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Verify PostgreSQL 17 client image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect postgres:17 >/dev/null
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version

      - name: Prepare isolated restore target and PR fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:17 createdb -h localhost -U postgres kleo_restore_target
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker run --rm --network host \
              -e PGPASSWORD=postgres \
              postgres:17 psql -h localhost -U postgres -d kleo_backup_fixture -v ON_ERROR_STOP=1 \
              -c "CREATE TABLE locations(id uuid PRIMARY KEY, name text NOT NULL); CREATE TABLE clients(id uuid PRIMARY KEY, full_name text NOT NULL, location_id uuid REFERENCES locations(id)); INSERT INTO locations VALUES('00000000-0000-4000-8000-000000000001','Backup fixture salon'); INSERT INTO clients VALUES('00000000-0000-4000-8000-000000000002','Backup fixture guest','00000000-0000-4000-8000-000000000001');"
          fi

      - name: Resolve source without exposing secret
        id: source
        shell: bash
        env:
          PRODUCTION_BACKUP_SOURCE: ${{ secrets.BACKUP_SOURCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=${LOCAL_SOURCE_URL}" >> "$GITHUB_OUTPUT"
            echo "environment=github-actions-postgresql17-rehearsal" >> "$GITHUB_OUTPUT"
          else
            if [ -z "${PRODUCTION_BACKUP_SOURCE:-}" ]; then
              echo "BACKUP_SOURCE_DATABASE_URL is not configured for scheduled/manual/production evidence" >&2
              exit 1
            fi
            echo "::add-mask::${PRODUCTION_BACKUP_SOURCE}"
            echo "url=${PRODUCTION_BACKUP_SOURCE}" >> "$GITHUB_OUTPUT"
            echo "environment=production-backup-isolated-restore" >> "$GITHUB_OUTPUT"
          fi

      - name: Run snapshot-consistent dump, isolated restore and consistency checks
        env:
          SOURCE_DATABASE_URL: ${{ steps.source.outputs.url }}
          BACKUP_EVIDENCE_ENVIRONMENT: ${{ steps.source.outputs.environment }}
        run: node tests/backup_restore_rehearsal.mjs

      - name: Upload backup restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: requirements-evidence-backup-restore-${{ github.sha }}
          path: evidence/requirements-evidence-backup-restore.json
          retention-days: 90

      - name: Publish production restore evidence to Release Control Center
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
          oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$oidc"
          payload="$(node -e 'process.stdout.write(JSON.stringify({entries:[{key:"backup.restore",status:"pass",evidence:"Production PostgreSQL 17 exported-snapshot dump + isolated restore + snapshot-consistent table/row verification PASS; artifact requirements-evidence-backup-restore"}]}))')"
          curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$API_BASE_URL/api/uat/release-control/evidence"

      - name: Close backup P0 after successful production evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = 270;
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            if (issue.data.state !== 'closed') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Successful canonical production PostgreSQL 17 exported-snapshot backup + isolated restore + snapshot-consistent table/row evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Release Control accepted backup.restore. Closing P0.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
            }

  alert-on-failure:
    if: ${{ always() && needs.restore-evidence.result == 'failure' && github.event_name != 'pull_request' }}
    needs: restore-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh backup evidence alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'P0: backup/restore evidence cycle failed';
            const { data } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            const existing = data.find(i => i.title === title);
            const body = `A KLEO-NFR-BCK-001 snapshot-consistent backup/restore evidence cycle failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. A failure is release-blocking until a successful restore evidence run exists.`;
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
