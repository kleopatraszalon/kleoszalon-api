name: Inventory v4 security fix
on:
  push:
    branches: [feature/inventory-operations-v4-20260813]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-operations-v4-20260813
      - name: Harden inventory v4 API
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/inventoryOperations.ts')
          s=p.read_text()

          anchor='router.use(async (_req, _res, next) => {\n  try { await ensureInventoryOperationsSchema(); next(); } catch (err) { next(err); }\n});\n'
          guard='''router.use((req: any, res, next) => {
  if (hasAnyRole(req.user?.role, ["admin", "manager", "location_manager", "salon_manager", "receptionist"])) return next();
  return res.status(403).json({ message: "Ehhez a készletgazdálkodási modulhoz nincs jogosultsága.", code: "inventory_operations_forbidden" });
});
'''
          if 'inventory_operations_forbidden' not in s:
              s=s.replace(anchor,anchor+'\n'+guard,1)

          old='''    if (!isGlobal(req)) {
      const own = ownLocation(req); if (!own) return res.json([]);
