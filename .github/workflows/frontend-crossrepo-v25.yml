name: Frontend cross-repo requirement evidence v25
on:
  pull_request:
    paths:
      - 'docs/requirements/**'
      - 'tests/frontend_crossrepo_v25.evidence.mjs'
      - '.github/workflows/frontend-crossrepo-v25.yml'
      - 'scripts/validate-requirement-automation.mjs'
      - 'scripts/generate-requirement-evidence.mjs'
  workflow_dispatch:

jobs:
  column-filter-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout API evidence repository
        uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout proven frontend revision
        uses: actions/checkout@v4
        with:
          repository: kleopatraszalon/kleoszalon-frontend
          ref: 926a913d5cb9235bde208ed689388803a50e761a
          path: frontend
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run KLEO v25/v26 column-filter evidence
        run: node api/tests/frontend_crossrepo_v25.evidence.mjs frontend
      - name: Production frontend build
        working-directory: frontend
        env:
          CI: false
        run: npm run build
