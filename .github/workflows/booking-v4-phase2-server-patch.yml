name: Booking 4.0 Phase 2 server patch

on:
  push:
    branches: [feature/booking-4-phase2]
    paths: [.github/workflows/booking-v4-phase2-server-patch.yml]

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-phase2
      - name: Mount Booking 4.0 chain router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts')
          s=p.read_text()
          if 'bookingV4ChainRouter' not in s:
              old='import onlineBookingRouter from"./routes/onlineBooking";import bookingV4Router from"./routes/bookingV4";import bookingV4AdminRouter from"./routes/bookingV4Admin";'
              new='import onlineBookingRouter from"./routes/onlineBooking";import bookingV4Router from"./routes/bookingV4";import bookingV4ChainRouter from"./routes/bookingV4Chain";import bookingV4AdminRouter from"./routes/bookingV4Admin";'
              if old not in s: raise SystemExit('import anchor not found')
              s=s.replace(old,new,1)
              old2='app.use("/api/public/booking",bookingV4Router);app.use("/api/public/booking",onlineBookingRouter);'
              new2='app.use("/api/public/booking",bookingV4ChainRouter);app.use("/api/public/booking",bookingV4Router);app.use("/api/public/booking",onlineBookingRouter);'
              if old2 not in s: raise SystemExit('mount anchor not found')
              s=s.replace(old2,new2,1)
              p.write_text(s)
          PY
      - name: Verify mount
        run: |
          grep -q 'bookingV4ChainRouter' src/server.ts
          grep -q 'bookingV4Chain' src/server.ts
      - name: Commit server mount
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/server.ts
          if git diff --cached --quiet; then
            echo "Mount already present"
          else
            git commit -m "feat(booking-v4): mount phase 2 chain router"
            git push origin HEAD:feature/booking-4-phase2
          fi
