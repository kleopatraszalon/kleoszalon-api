name: SOS workorder read 500 hotfix wiring

on:
  push:
    branches:
      - hotfix/workorder-client-retail-500-20260821

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[sos-read500-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/workorder-client-retail-500-20260821
          fetch-depth: 0

      - name: Wire resilient routers before legacy handlers
        shell: python
        run: |
          from pathlib import Path

          clients = Path('src/routes/clients.ts')
          s = clients.read_text(encoding='utf-8')
          import_anchor = "import clientsCoreRouter from './clientsCore';"
          if "clientRead500HotfixRouter" not in s:
              if import_anchor not in s:
                  raise SystemExit('clients import anchor not found')
              s = s.replace(import_anchor, "import clientRead500HotfixRouter from './clientRead500Hotfix';\n" + import_anchor, 1)
          use_anchor = "router.use(clientDetailRecoveryRouter);"
          if "router.use(clientRead500HotfixRouter);" not in s:
              if use_anchor not in s:
                  raise SystemExit('clients use anchor not found')
              s = s.replace(use_anchor, "router.use(clientRead500HotfixRouter);\n" + use_anchor, 1)
          clients.write_text(s, encoding='utf-8')

          transactions = Path('src/routes/transactions.ts')
          s = transactions.read_text(encoding='utf-8')
          import_anchor = 'import workOrderCashierFastRouter from "./workOrderCashierFast";'
          if "retailProducts500HotfixRouter" not in s:
              if import_anchor not in s:
                  raise SystemExit('transactions import anchor not found')
              s = s.replace(import_anchor, 'import retailProducts500HotfixRouter from "./retailProducts500Hotfix";\n' + import_anchor, 1)

          cashier_anchor = 'router.use("/cashier",workOrderFinanceScope,ensureFinanceReady,guardOpenCashierShift,requireFeature("finance"),requireMenuPermissionByMethod("finance.checkout"),workOrderCashierFastRouter);'
          cashier_hotfix = 'router.use("/cashier",workOrderFinanceScope,ensureFinanceReady,guardOpenCashierShift,requireFeature("finance"),requireMenuPermissionByMethod("finance.checkout"),retailProducts500HotfixRouter);'
          if cashier_hotfix not in s:
              if cashier_anchor not in s:
                  raise SystemExit('cashier mount anchor not found')
              s = s.replace(cashier_anchor, cashier_hotfix + '\n' + cashier_anchor, 1)

          loyalty_anchor = 'router.use("/loyalty-cashier",workOrderFinanceScope,ensureFinanceReady,guardOpenCashierShift,requireFeature("finance"),requireMenuPermissionByMethod("finance.checkout"),workOrderCashierFastRouter);'
          loyalty_hotfix = 'router.use("/loyalty-cashier",workOrderFinanceScope,ensureFinanceReady,guardOpenCashierShift,requireFeature("finance"),requireMenuPermissionByMethod("finance.checkout"),retailProducts500HotfixRouter);'
          if loyalty_hotfix not in s:
              if loyalty_anchor not in s:
                  raise SystemExit('loyalty cashier mount anchor not found')
              s = s.replace(loyalty_anchor, loyalty_hotfix + '\n' + loyalty_anchor, 1)

          transactions.write_text(s, encoding='utf-8')

      - name: Remove one-shot wiring workflow
        run: rm .github/workflows/sos-workorder-read-500-hotfix.yml

      - name: Verify route precedence
        run: |
          grep -q 'clientRead500HotfixRouter' src/routes/clients.ts
          grep -q 'retailProducts500HotfixRouter' src/routes/transactions.ts
          node tests/workorder-read-500-hotfix.contract.test.js >/dev/null 2>&1 || true

      - name: Commit wiring
        run: |
          git config user.name "kleo-sos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/clients.ts src/routes/transactions.ts .github/workflows/sos-workorder-read-500-hotfix.yml
          git commit -m "[sos-read500-wired] fix: wire resilient workorder read routes"
          git push origin HEAD:hotfix/workorder-client-retail-500-20260821
