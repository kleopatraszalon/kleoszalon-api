name: CRM test diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/crm-spec-v2-20260812

permissions:
  contents: read
  statuses: write

jobs:
  aggregate-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture aggregate test output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node --test --test-concurrency=1 tests/*.test.js > /tmp/crm-tests.tap 2>&1
          code=$?
          set -e

          post_status() {
            state="$1"
            context="$2"
            description="$3"
            payload="$(node -e 'const [state,context,description]=process.argv.slice(1); process.stdout.write(JSON.stringify({state,context,description:description.slice(0,139)}))' "$state" "$context" "$description")"
            curl -sSf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "$payload"
          }

          tests="$(grep -E '^# tests ' /tmp/crm-tests.tap | tail -1 | sed 's/^# //')"
          passed="$(grep -E '^# pass ' /tmp/crm-tests.tap | tail -1 | sed 's/^# //')"
          failed="$(grep -E '^# fail ' /tmp/crm-tests.tap | tail -1 | sed 's/^# //')"
          summary="${tests:-tests ?}; ${passed:-pass ?}; ${failed:-fail ?}"
          if [ "$code" -eq 0 ]; then
            post_status success diagnostic/aggregate-summary "$summary"
          else
            post_status failure diagnostic/aggregate-summary "$summary"
          fi

          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            i=$((i+1))
            post_status failure "diagnostic/not-ok-$i" "$line"
          done < <(grep -E '^not ok [0-9]+ - ' /tmp/crm-tests.tap | head -20)

          j=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            j=$((j+1))
            post_status failure "diagnostic/failure-file-$j" "$file"
          done < <(grep -E -B 5 -A 15 '^not ok [0-9]+ - ' /tmp/crm-tests.tap | grep -oE 'tests/[A-Za-z0-9_.-]+\.test\.js' | sort -u | head -20)

          if [ "$i" -eq 0 ] && [ "$code" -ne 0 ]; then
            tail_line="$(tail -20 /tmp/crm-tests.tap | tr '\n' ' ' | tr -s ' ' | cut -c1-139)"
            post_status failure diagnostic/no-not-ok "${tail_line:-non-zero exit without TAP not-ok line}"
          fi

          echo "==== full TAP output ===="
          cat /tmp/crm-tests.tap
          exit "$code"
