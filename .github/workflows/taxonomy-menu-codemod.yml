name: Taxonomy menu codemod
on:
  push:
    branches:
      - feature/inventory-taxonomy-admin-v3-20260813
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-taxonomy-admin-v3-20260813
          fetch-depth: 0
      - name: Patch taxonomy menu safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/menu/ensureMenuHealth.ts')
          s=p.read_text()
          block="""\n  // Terméktörzs v3: kézi taxonómia-felülvizsgálat csak menedzsmentnek.\n  await safe(`WITH p AS (SELECT id FROM menus WHERE code='inventory' LIMIT 1)\n    INSERT INTO menus(code,name,icon,route,order_index,parent_id,feature_key,is_active)\n    SELECT 'inventory.taxonomy_review','Besorolás ellenőrzése','Tags','/masterdata/products/taxonomy-review',35,p.id,'inventory',true FROM p\n    ON CONFLICT(code) DO UPDATE SET name=EXCLUDED.name,icon=EXCLUDED.icon,route=EXCLUDED.route,order_index=EXCLUDED.order_index,parent_id=EXCLUDED.parent_id,feature_key='inventory',is_active=true`);\n  await safe(`INSERT INTO role_menu_permissions(role_key,menu_id,can_view,can_create,can_edit,can_delete,can_approve,can_export,can_view_financial,can_manage_permissions,scope_type,updated_at)\n    SELECT r.role_key,m.id,true,false,true,false,true,true,false,false,CASE WHEN r.role_key='admin' THEN 'all_locations' ELSE 'own_location' END,now()\n    FROM (VALUES('admin'),('manager')) r(role_key) CROSS JOIN menus m WHERE m.code='inventory.taxonomy_review'\n    ON CONFLICT(role_key,menu_id) DO UPDATE SET can_view=true,can_edit=true,can_approve=true,can_export=true,scope_type=EXCLUDED.scope_type,updated_at=now()`);\n  await safe(`INSERT INTO role_menu_permissions(role_key,menu_id,can_view,can_create,can_edit,can_delete,can_approve,can_export,can_view_financial,can_manage_permissions,scope_type,updated_at)\n    SELECT r.role_key,m.id,false,false,false,false,false,false,false,false,'own_location',now()\n    FROM (VALUES('location_manager'),('salon_manager'),('receptionist'),('employee'),('customer')) r(role_key) CROSS JOIN menus m WHERE m.code='inventory.taxonomy_review'\n    ON CONFLICT(role_key,menu_id) DO UPDATE SET can_view=false,can_edit=false,can_approve=false,updated_at=now()`);\n"""
          if "inventory.taxonomy_review" not in s:
              needle="  await safe(`UPDATE menus SET route='/webshop/admin',is_active=true WHERE code='commerce.webshop'`);"
              if needle not in s: raise SystemExit('menu anchor missing')
              s=s.replace(needle,block+'\n'+needle,1)
          p.write_text(s)
          PY
      - name: Commit menu integration
        run: |
          if git diff --quiet -- src/menu/ensureMenuHealth.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/menu/ensureMenuHealth.ts
          git commit -m "feat(inventory): add taxonomy review menu permission"
          git push origin HEAD:feature/inventory-taxonomy-admin-v3-20260813
