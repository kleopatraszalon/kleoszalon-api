name: Finalize dashboard runtime fix

on:
  push:
    branches:
      - agent/fix-dashboard-runtime-500s
    paths:
      - scripts/finalize-dashboard-runtime-fix.mjs
      - .github/workflows/finalize-dashboard-runtime-fix.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-runtime-500s
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final placeholder correction
        run: node scripts/finalize-dashboard-runtime-fix.mjs
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build backend
        run: npm run build
      - name: Commit validated source and remove one-shot assets
        run: |
          rm scripts/finalize-dashboard-runtime-fix.mjs
          rm .github/workflows/finalize-dashboard-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate dashboard runtime compatibility"
          git push origin HEAD:agent/fix-dashboard-runtime-500s
