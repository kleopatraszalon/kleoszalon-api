name: Franchise accounting integration

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/routes/franchiseAccounting.ts"
      - "src/routes/franchiseFinance.ts"
      - "src/sql/20260816_FRANCHISE_ACCOUNTING_V6.sql"
      - "src/finance/ensureFinanceNav.ts"
      - "tests/franchise_accounting.integration.js"
      - "tests/franchise_accounting_integration_schema.sql"
      - ".github/workflows/franchise-accounting-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kleo_franchise_accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kleo_franchise_accounting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kleo_franchise_accounting_test
      PGSSL: off
      JWT_SECRET: franchise_accounting_ci_secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build API
        run: npm run build
      - name: Create franchise accounting integration schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/franchise_accounting_integration_schema.sql
      - name: Apply franchise accounting V6 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/sql/20260816_FRANCHISE_ACCOUNTING_V6.sql
      - name: Run franchise accounting integration
        run: node tests/franchise_accounting.integration.js
