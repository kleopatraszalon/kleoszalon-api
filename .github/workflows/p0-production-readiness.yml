name: P0 production readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/P0_PRODUCTION_CLOSURE_RUNBOOK.md'
  schedule:
    - cron: '45 2 * * *'

permissions:
  contents: read
  issues: read
  statuses: write

jobs:
  p0-production-readiness:
    name: p0-production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify P0 controls
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const isPullRequest = context.eventName === 'pull_request';
            const failures = [];
            const details = [];
            const notices = [];
            const canonicalRequiredChecks = ['build','regression-build-rbac-security','production-baseline-smoke'];

            await github.rest.repos.createCommitStatus({ owner, repo, sha, state:'pending', context:'p0/production-readiness', description:isPullRequest ? 'Checking P0 branch governance for remediation PR' : 'Checking production P0 controls' });

            try {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch:'main' });
              if (!branch.data.protected) failures.push('P0/4: main branch is not protected');
              else details.push('P0/4: main branch reports protected=true');
              const contexts = branch.data.protection?.required_status_checks?.contexts || [];
              for (const required of canonicalRequiredChecks) if (!contexts.includes(required)) failures.push(`P0/4: required status check ${required} is missing on main`);
              if (canonicalRequiredChecks.every(required => contexts.includes(required))) details.push(`P0/4: canonical required checks active: ${canonicalRequiredChecks.join(', ')}`);
            } catch (error) { failures.push(`P0/4: readable branch protection baseline cannot be proven (${error.status || error.message})`); }

            try {
              const issue = await github.rest.issues.get({ owner, repo, issue_number:320 });
              if (issue.data.state !== 'closed') isPullRequest ? notices.push('P0/4 governance evidence: issue #320 remains open; production stays blocked') : failures.push('P0/4 governance evidence: issue #320 is still open');
              else details.push('P0/4 governance evidence: issue #320 closed');
            } catch { isPullRequest ? notices.push('P0/4 governance evidence cannot be verified') : failures.push('P0/4 governance evidence cannot be verified'); }

            // Operator decision 2026-08-19: current credentials are accepted as trusted
            // under restricted single-operator access. Rotation is deferred. This is
            // risk acceptance, not a claim that provider-side rotation occurred.
            details.push('P0/2 credential rotation: operator risk acceptance recorded; rotation deferred');

            const productionIssues = [
              { number:270, label:'P0/1 backup/restore evidence' },
              { number:212, label:'P0/3 NAV TEST configuration/UAT' },
            ];
            for (const item of productionIssues) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number:item.number });
                if (issue.data.state !== 'closed') isPullRequest ? notices.push(`${item.label}: issue #${item.number} remains open; production stays blocked`) : failures.push(`${item.label}: issue #${item.number} is still open`);
                else details.push(`${item.label}: issue #${item.number} closed`);
              } catch { isPullRequest ? notices.push(`${item.label}: issue #${item.number} could not be verified`) : failures.push(`${item.label}: issue #${item.number} cannot be verified`); }
            }

            const state = failures.length ? 'failure' : 'success';
            const description = failures.length ? `${failures.length} required P0 blocker(s) remain` : isPullRequest ? 'P0 remediation PR governance PASS' : 'Production P0 controls accepted';
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state, context:'p0/production-readiness', description:description.slice(0,140), target_url:`${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` });
            core.summary.addHeading('VIR P0 production readiness');
            if (details.length) core.summary.addList(details);
            if (notices.length) core.summary.addHeading('Production blockers still open',2).addList(notices);
            if (failures.length) { core.summary.addHeading('Blocking controls',2).addList(failures); await core.summary.write(); core.setFailed(failures.join(' | ')); }
            else { core.summary.addRaw(isPullRequest ? 'Remediation PR may proceed; production remains fail-closed for unresolved controls.\n' : 'All required production P0 controls are closed or explicitly risk-accepted.\n'); await core.summary.write(); }
