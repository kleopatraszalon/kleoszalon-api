name: P0 production readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/P0_PRODUCTION_CLOSURE_RUNBOOK.md'
  schedule:
    - cron: '45 2 * * *'

permissions:
  contents: read
  issues: read
  statuses: write

jobs:
  p0-production-readiness:
    name: p0-production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify P0 production controls and PR governance
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const isPullRequest = context.eventName === 'pull_request';
            const failures = [];
            const details = [];

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: 'p0/production-readiness',
              description: isPullRequest
                ? 'Checking PR governance while production P0 remains fail-closed'
                : 'Checking backup, credential rotation, NAV TEST and main protection'
            });

            // P0/4: use readable branch metadata plus the closed governance-evidence issue.
            // GitHub Actions' default token can receive 403 on getBranchProtection even when
            // branch protection is correctly configured, so that admin-only endpoint is not
            // used as the sole source of truth inside this workflow.
            try {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (!branch.data.protected) failures.push('P0/4: main branch is not protected');
              else details.push('P0/4: main branch reports protected=true');

              const governanceIssue = await github.rest.issues.get({ owner, repo, issue_number: 320 });
              if (governanceIssue.data.state !== 'closed') {
                failures.push('P0/4: branch-governance evidence issue #320 is not closed');
              } else {
                details.push('P0/4: governance evidence issue #320 is closed');
              }
            } catch (error) {
              failures.push(`P0/4: branch governance cannot be proven (${error.status || error.message})`);
            }

            // Development may continue while external operator actions remain open, but only
            // if the separate workflow_run production guard exists. Production readiness on
            // main/schedule/manual remains fail-closed until all three issues are actually closed.
            if (isPullRequest) {
              try {
                await github.rest.repos.getContent({ owner, repo, path: '.github/workflows/p0-render-deploy-guard.yml', ref: 'main' });
                details.push('PR governance: P0 Render deploy guard exists on main');
              } catch (error) {
                failures.push('PR governance: P0 Render deploy guard cannot be verified on main');
              }
            }

            const requiredIssues = [
              { number: 270, label: 'P0/1 backup/restore evidence' },
              { number: 62, label: 'P0/2 credential rotation' },
              { number: 212, label: 'P0/3 NAV TEST configuration/UAT' },
            ];

            for (const item of requiredIssues) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: item.number });
                if (issue.data.state !== 'closed') {
                  if (isPullRequest) {
                    details.push(`${item.label}: issue #${item.number} remains a production blocker; code merge stays permitted because production deploy guard is active`);
                  } else {
                    failures.push(`${item.label}: issue #${item.number} is still open`);
                  }
                } else {
                  details.push(`${item.label}: issue #${item.number} closed`);
                }
              } catch (error) {
                failures.push(`${item.label}: issue #${item.number} cannot be verified`);
              }
            }

            const state = failures.length ? 'failure' : 'success';
            const description = failures.length
              ? `${failures.length} P0/governance blocker(s) remain`
              : isPullRequest
                ? 'PR governance PASS; production P0 remains enforced by deploy guard'
                : 'All four P0 production controls are closed';

            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state,
              context: 'p0/production-readiness',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });

            core.summary.addHeading('VIR P0 production readiness');
            if (details.length) core.summary.addList(details);
            if (failures.length) {
              core.summary.addHeading('Blocking controls', 2).addList(failures);
              await core.summary.write();
              core.setFailed(failures.join(' | '));
            } else {
              core.summary.addRaw(isPullRequest
                ? 'PR governance is proven. Production deploy remains independently fail-closed until external P0 controls are closed.\n'
                : 'All four P0 controls are proven closed.\n');
              await core.summary.write();
            }
