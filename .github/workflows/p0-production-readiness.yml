name: P0 production readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/P0_PRODUCTION_CLOSURE_RUNBOOK.md'
  schedule:
    - cron: '45 2 * * *'

permissions:
  contents: read
  issues: read
  statuses: write

jobs:
  p0-production-readiness:
    name: p0-production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify P0 controls
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const isPullRequest = context.eventName === 'pull_request';
            const failures = [];
            const details = [];
            const notices = [];
            const canonicalRequiredChecks = [
              'build',
              'regression-build-rbac-security',
              'production-baseline-smoke'
            ];

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: 'p0/production-readiness',
              description: isPullRequest
                ? 'Checking P0 branch governance for remediation PR'
                : 'Checking all production P0 controls'
            });

            // P0/4 is proven from active rules that apply to main. This endpoint only
            // needs repository metadata read permission, unlike the classic branch-
            // protection admin endpoint, so GITHUB_TOKEN can verify it fail-closed.
            try {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (!branch.data.protected) {
                failures.push('P0/4: main branch is not protected');
              } else {
                details.push('P0/4: main branch reports protected=true');
              }

              const rulesResponse = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner,
                repo,
                branch: 'main',
                per_page: 100,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' }
              });
              const rules = Array.isArray(rulesResponse.data) ? rulesResponse.data : [];

              const statusRule = rules.find(rule => rule.type === 'required_status_checks');
              const ruleChecks = statusRule?.parameters?.required_status_checks || [];
              const ruleContexts = ruleChecks.map(check => String(check.context || '')).filter(Boolean);
              const branchContexts = branch.data.protection?.required_status_checks?.contexts || [];
              const contexts = [...new Set([...ruleContexts, ...branchContexts])];
              for (const required of canonicalRequiredChecks) {
                if (!contexts.includes(required)) {
                  failures.push(`P0/4: required status check ${required} is missing on main`);
                }
              }
              if (canonicalRequiredChecks.every(required => contexts.includes(required))) {
                details.push(`P0/4: canonical required checks active: ${canonicalRequiredChecks.join(', ')}`);
              }

              const pullRequestRule = rules.find(rule => rule.type === 'pull_request');
              const approvals = Number(pullRequestRule?.parameters?.required_approving_review_count || 0);
              if (!pullRequestRule) {
                failures.push('P0/4: pull-request rule is not active on main');
              } else if (approvals < 1) {
                failures.push('P0/4: at least one approving PR review is not required on main');
              } else {
                details.push(`P0/4: required approving PR reviews=${approvals}`);
              }

              if (!rules.some(rule => rule.type === 'non_fast_forward')) {
                failures.push('P0/4: non-fast-forward protection is not active; force pushes are not proven blocked');
              } else {
                details.push('P0/4: non-fast-forward rule active; force pushes blocked');
              }

              if (!rules.some(rule => rule.type === 'deletion')) {
                failures.push('P0/4: deletion protection rule is not active on main');
              } else {
                details.push('P0/4: branch deletion protection rule active');
              }
            } catch (error) {
              failures.push(`P0/4: readable branch governance rules cannot be proven (${error.status || error.message})`);
            }

            const productionIssues = [
              { number: 270, label: 'P0/1 backup/restore evidence' },
              { number: 62, label: 'P0/2 credential rotation' },
              { number: 212, label: 'P0/3 NAV TEST configuration/UAT' },
            ];

            for (const item of productionIssues) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: item.number });
                if (issue.data.state !== 'closed') {
                  if (isPullRequest) {
                    notices.push(`${item.label}: issue #${item.number} remains open; production stays blocked`);
                  } else {
                    failures.push(`${item.label}: issue #${item.number} is still open`);
                  }
                } else {
                  details.push(`${item.label}: issue #${item.number} closed`);
                }
              } catch (error) {
                if (isPullRequest) {
                  notices.push(`${item.label}: issue #${item.number} could not be verified; production stays blocked`);
                } else {
                  failures.push(`${item.label}: issue #${item.number} cannot be verified`);
                }
              }
            }

            const state = failures.length ? 'failure' : 'success';
            const description = failures.length
              ? `${failures.length} required P0 governance blocker(s) remain`
              : isPullRequest
                ? 'P0 remediation PR governance PASS; production controls remain enforced separately'
                : 'All production P0 controls are closed';

            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state,
              context: 'p0/production-readiness',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });

            core.summary.addHeading('VIR P0 production readiness');
            if (details.length) core.summary.addList(details);
            if (notices.length) {
              core.summary.addHeading('Production blockers still open', 2).addList(notices);
            }
            if (failures.length) {
              core.summary.addHeading('Blocking controls', 2).addList(failures);
              await core.summary.write();
              core.setFailed(failures.join(' | '));
            } else {
              core.summary.addRaw(isPullRequest
                ? 'Remediation PR may proceed; production deploy remains fail-closed until P0/1–P0/3 are closed.\n'
                : 'All production P0 controls are proven closed.\n');
              await core.summary.write();
            }
