name: Production readiness gate

on:
  push:
    branches:
      - agent/security-regression-hardening-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 1. TELJES INSTALL — kizárólag a lockfile alapján, reprodukálható módon.
      - name: 1 - Clean full install
        run: npm ci --no-fund --no-audit

      # 2. REGRESSZIÓ — a jelenlegi VIR baseline pontosan 320 sikeres teszt.
      - name: 2 - Run 320 regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/regression.log

          tests=$(grep -E '^# tests [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          passed=$(grep -E '^# pass [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')
          failed=$(grep -E '^# fail [0-9]+$' /tmp/regression.log | tail -1 | awk '{print $3}')

          echo "Regression summary: tests=${tests:-unknown}, pass=${passed:-unknown}, fail=${failed:-unknown}"

          if [ "$tests" != "320" ] || [ "$passed" != "320" ] || [ "${failed:-1}" != "0" ]; then
            echo "ERROR: Regression gate requires exactly 320 tests, 320 passes and 0 failures."
            exit 1
          fi

      # 3. TYPESCRIPT PRODUCTION BUILD — minden TS hiba blokkolja az élesítést.
      - name: 3 - TypeScript production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      # 4. PRODUCTION DEPENDENCY AUDIT — high/critical sérülékenység blokkol.
      # NINCS npm audit fix --force, és ez a workflow semmilyen dependency-t nem módosít.
      - name: 4 - Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Readiness summary
        if: success()
        run: |
          echo "PRODUCTION READINESS GATE: PASS"
          echo "Install: PASS"
          echo "Regression: 320/320 PASS"
          echo "TypeScript production build: PASS"
          echo "Production dependency audit (high/critical): PASS"
          echo "Breaking npm audit fix --force: NOT USED"
