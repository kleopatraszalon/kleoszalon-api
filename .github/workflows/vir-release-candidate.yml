name: VIR release candidate gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vir-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-build-rbac-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Deterministic clean install
        run: npm ci --no-audit --no-fund

      - name: Full contract regression suite
        run: npm test

      - name: TypeScript production build
        run: npm run build

      - name: Critical workorder and RBAC regression subset
        run: npm run test:workorders

      - name: Capture production dependency audit
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: api-production-audit
          path: audit-prod.json
          retention-days: 1

      - name: Production dependency security gate
        run: node -e "const a=require('./audit-prod.json'); const v=a.metadata?.vulnerabilities||{}; console.log(v); if((v.high||0)+(v.critical||0)>0) process.exit(1)"

  production-baseline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull request cannot repair an already-broken live endpoint until it can
      # merge and deploy. Therefore live-production smoke remains visible on PRs,
      # but is advisory there. On push to main and manual release validation it is
      # strict and blocks the release if production is unhealthy.
      - name: API liveness
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 3 https://kleoszalon-api-1.onrender.com/api/health

      - name: Public daily actions integration
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 3 https://kleoszalon-api-1.onrender.com/api/public/marketing/daily-actions

      - name: Public booking integration
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 3 https://kleoszalon-api-1.onrender.com/api/public/marketing/booking/health

      - name: Production smoke policy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Live production smoke is advisory on pull requests to avoid repair deadlocks."
          else
            echo "Live production smoke is strict on main/release validation."
          fi
