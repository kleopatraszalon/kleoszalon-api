name: Inventory v4 codemod
on:
  push:
    branches: [feature/inventory-operations-v4-20260813]
permissions:
  contents: write
jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-operations-v4-20260813
      - name: Complete inventory v4 wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/menu/ensureMenuHealth.ts')
          s=p.read_text()
          imp='import { ensureInventoryOperationsMenu } from "./ensureInventoryOperationsMenu";\n'
          if 'ensureInventoryOperationsMenu' not in s:
              s=s.replace("import pool from '../db';\n", "import pool from '../db';\n"+imp, 1)
          s=s.replace('  await ensureInventoryOperationsMenu();\n','',1)
          marker="  await pool.query(`ALTER TABLE menus ADD COLUMN IF NOT EXISTS code text;ALTER TABLE menus ADD COLUMN IF NOT EXISTS feature_key text;ALTER TABLE menus ADD COLUMN IF NOT EXISTS is_active boolean NOT NULL DEFAULT true;`);\n"
          if marker in s and 'await ensureInventoryOperationsMenu();' not in s:
              s=s.replace(marker,marker+'  await ensureInventoryOperationsMenu();\n',1)
          p.write_text(s)

          p=Path('src/routes/inventoryOperations.ts')
          s=p.read_text()
          anchor='router.post("/warehouses", async (req: any, res, next) => {'
          endpoint="router.get(\"/transfer-targets\", async (req: any, res, next) => {\n  try {\n    ensureOperator(req);\n    const { rows } = await db.query(`SELECT w.id,w.name,w.location_id,l.name AS location_name,w.warehouse_type FROM inventory_warehouses w LEFT JOIN locations l ON l.id::text=w.location_id WHERE w.active=true ORDER BY COALESCE(l.name,'Központ'),w.sort_order,w.name`);\n    res.json(rows);\n  } catch (err) { sendError(err, res, next); }\n});\n\n"
          if '/transfer-targets' not in s and anchor in s:
              s=s.replace(anchor,endpoint+anchor,1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git add src/menu/ensureMenuHealth.ts src/routes/inventoryOperations.ts
          git commit -m "feat(inventory): finish v4 menu and transfer targets"
          git push origin HEAD:feature/inventory-operations-v4-20260813
